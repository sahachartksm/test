<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183b32" />
    <title>Fibre Ready — เตรียมพร้อมใน 5 วัน</title>
    <script>
      // Apply the saved appearance before first paint to avoid a light flash.
      try {
        const saved = JSON.parse(localStorage.getItem("fibre-ready:v1"));
        document.documentElement.dataset.theme =
          saved?.theme === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <style>
      /* 1. Design tokens & mobile-first layout. No external fonts/assets. */
      :root {
        color-scheme: light;
        --bg: #f5f6f1;
        --paper: #fff;
        --ink: #203b33;
        --muted: #63716b;
        --line: #dce3da;
        --green: #285943;
        --lime: #d6ef8a;
        --pale: #eef4e8;
        --red: #a33138;
        --red-bg: #fff0ee;
        --amber: #94611a;
        --amber-bg: #fff5de;
        --radius: 20px;
        --shadow: 0 6px 24px #203b3305;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.75 Tahoma,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }
      a {
        color: var(--green);
        text-underline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(27px, 4vw, 38px);
        line-height: 1.4;
        letter-spacing: -0.8px;
      }
      h2 {
        font-size: 22px;
        line-height: 1.5;
      }
      h3 {
        font-size: 18px;
      }
      p + p {
        margin-top: 10px;
      }
      small,
      .small {
        font-size: 13px;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .stack > * + * {
        margin-top: 22px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .icon {
        width: 22px;
        height: 22px;
        flex: none;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 46px;
        padding: 10px 19px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: white;
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
        line-height: 1.5;
      }
      .btn:hover {
        background: var(--pale);
        border-color: #9db592;
      }
      .btn.primary {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      .btn.primary:hover {
        background: #183b32;
      }
      .btn.lime {
        background: var(--lime);
        border-color: var(--lime);
        color: #233c23;
      }
      .btn.danger {
        color: var(--red);
        border-color: #e0b3b3;
      }
      .btn:disabled {
        opacity: 0.5;
      }
      .btn.text {
        border-color: transparent;
        background: transparent;
        padding-inline: 8px;
      }
      :focus-visible {
        outline: 3px solid #658a23;
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      .skip {
        position: fixed;
        top: -100px;
        left: 12px;
        z-index: 20;
      }
      .skip:focus {
        top: 12px;
      }
      .sidebar {
        padding: 18px 20px;
        background: #fcfdf9;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        gap: 11px;
        align-items: center;
        color: var(--ink);
        text-decoration: none;
        line-height: 1.3;
      }
      .brandmark {
        width: 39px;
        height: 39px;
        border-radius: 12px;
        background: var(--green);
        color: var(--lime);
        display: grid;
        place-items: center;
      }
      .brand strong {
        font-size: 20px;
        letter-spacing: -0.6px;
      }
      .brand small {
        display: block;
        font-size: 10px;
        letter-spacing: 1.6px;
        margin-top: 4px;
        color: var(--muted);
      }
      .nav-label,
      .side-note {
        display: none;
      }
      .nav {
        display: flex;
        gap: 5px;
        margin-top: 20px;
        overflow-x: auto;
        padding: 3px;
      }
      .nav button {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        white-space: nowrap;
        background: transparent;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        min-height: 45px;
      }
      .nav button.active {
        background: #e9efdf;
        color: var(--green);
        font-weight: bold;
      }
      .nav .dayname {
        display: none;
      }
      .nav-num {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        font-size: 12px;
        border: 1px solid #d1dbcb;
        border-radius: 7px;
      }
      .nav .settings-link {
        margin-left: auto;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        background: #ffffff55;
      }
      .offline {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--green);
        white-space: nowrap;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #638b32;
        display: inline-block;
      }
      .main {
        max-width: 1170px;
        margin: auto;
        padding: 25px 20px 48px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-end;
        margin-bottom: 24px;
      }
      .page-head p {
        margin-top: 8px;
        color: var(--muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        line-height: 1.5;
        padding: 6px 10px;
        border-radius: 20px;
        background: var(--pale);
        color: var(--green);
        font-weight: 700;
        white-space: nowrap;
      }
      .pill.neutral {
        background: #eff1ed;
        color: var(--muted);
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 22px;
        box-shadow: var(--shadow);
      }
      .hero {
        background: var(--ink);
        color: #fff;
        padding: 28px;
        position: relative;
        overflow: hidden;
      }
      .hero p {
        color: #d4e0d7;
        margin: 12px 0 20px;
        max-width: 530px;
      }
      .hero .eyebrow {
        color: var(--lime);
        margin-bottom: 13px;
      }
      .hero h2 {
        font-size: 27px;
      }
      .hero-art {
        display: none;
      }
      .hero .btn {
        position: relative;
      }
      .progress {
        width: 100%;
        height: 8px;
        appearance: none;
        border: 0;
        border-radius: 9px;
        overflow: hidden;
        display: block;
        background: #e9eee4;
      }
      .progress::-webkit-progress-bar {
        background: #e9eee4;
        border-radius: 9px;
      }
      .progress::-webkit-progress-value {
        background: var(--green);
        border-radius: 9px;
      }
      .progress::-moz-progress-bar {
        background: var(--green);
        border-radius: 9px;
      }
      .progress.large {
        height: 10px;
      }
      .metric-value {
        font-size: 34px;
        font-weight: bold;
        line-height: 1.3;
      }
      .metric-value span {
        font-size: 15px;
        font-weight: normal;
        color: var(--muted);
      }
      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .metrics .panel {
        padding: 18px;
      }
      .metric-icon {
        color: var(--green);
        margin-bottom: 12px;
      }
      .section-heading {
        margin: 30px 0 16px;
      }
      .day-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 22px;
        position: relative;
      }
      .day-card .day-icon {
        width: 46px;
        height: 46px;
        background: var(--pale);
        border-radius: 13px;
        display: grid;
        place-items: center;
        color: var(--green);
        margin-bottom: 18px;
      }
      .day-card .eyebrow {
        color: var(--muted);
        margin-bottom: 6px;
      }
      .day-card h3 {
        margin-bottom: 9px;
      }
      .day-card .desc {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 22px;
        flex: 1;
      }
      .day-card .btn {
        margin-top: 18px;
        width: 100%;
      }
      .day-card .pill {
        position: absolute;
        top: 25px;
        right: 20px;
      }
      .card-meta {
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0;
      }
      .day-card.recommended {
        border-color: #9ab779;
      }
      .learn-tip {
        background: #eff2e6;
        border-color: #dce3c8;
      }
      .memory-bar {
        height: 14px;
        display: flex;
        overflow: hidden;
        border-radius: 9px;
        background: #ecefe8;
        margin: 18px 0;
      }
      .memory-bar span {
        height: 100%;
      }
      .weak-color {
        background: #c6813c;
      }
      .learning-color {
        background: #a7b968;
      }
      .mastered-color {
        background: #285943;
      }
      .memory-legend {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .legend-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 3px;
        margin-right: 7px;
      }
      .footer {
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        margin-top: 36px;
        padding-top: 20px;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        gap: 6px;
        margin-bottom: 24px;
      }
      .tabs button {
        flex: 1;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        padding: 14px 8px;
        color: var(--muted);
        font-weight: bold;
        white-space: nowrap;
      }
      .tabs button[aria-selected="true"] {
        color: var(--green);
        border-bottom-color: var(--green);
      }
      .lesson-grid {
        display: grid;
        gap: 16px;
      }
      .lesson h3 {
        margin-bottom: 10px;
      }
      .lesson p,
      .lesson li {
        font-size: 15px;
      }
      .lesson ul,
      .lesson ol {
        padding-left: 24px;
        margin-bottom: 0;
      }
      .callout {
        padding: 17px 20px;
        border-left: 4px solid #91ac64;
        background: var(--pale);
        border-radius: 0 12px 12px 0;
        margin-top: 16px;
      }
      .callout.warning {
        border-color: #be873a;
        background: var(--amber-bg);
        color: #6e501c;
      }
      .table-wrap {
        overflow-x: auto;
        margin-top: 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 610px;
        font-size: 14px;
      }
      caption {
        text-align: left;
        padding: 12px;
        font-weight: bold;
        background: var(--pale);
      }
      th,
      td {
        padding: 14px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      th {
        background: #f4f7ee;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .led {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 5px;
        background: #718d48;
      }
      .led.red {
        background: #ba4444;
      }
      .led.gray {
        background: #89938b;
      }
      .flow {
        list-style: none;
        padding: 0 !important;
        counter-reset: steps;
      }
      .flow li {
        position: relative;
        margin-bottom: 32px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 18px 18px 62px;
        background: white;
        counter-increment: steps;
      }
      .flow li:before {
        content: counter(steps, decimal-leading-zero);
        position: absolute;
        left: 16px;
        top: 18px;
        color: var(--green);
        font-weight: bold;
      }
      .flow li:not(:last-child):after {
        content: "↓";
        position: absolute;
        bottom: -30px;
        left: 28px;
        color: #829773;
        font-size: 23px;
      }
      .flow li:last-child {
        margin-bottom: 0;
      }
      .flow strong {
        display: block;
      }
      .flash-shell {
        max-width: 680px;
        margin: auto;
      }
      .flashcard {
        width: 100%;
        min-height: 280px;
        padding: 0;
        background: transparent;
        border: 0;
        perspective: 1000px;
        color: var(--ink);
      }
      .flash-inner {
        display: grid;
        transform-style: preserve-3d;
        transition: transform 0.45s;
        min-height: 280px;
      }
      .flashcard.flipped .flash-inner {
        transform: rotateY(180deg);
      }
      .flash-face {
        grid-area: 1/1;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border: 1px solid #cbd9b8;
        border-radius: 22px;
        background: #f0f5e6;
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
      }
      .flash-face strong {
        font-size: 32px;
        line-height: 1.4;
      }
      .flash-back {
        transform: rotateY(180deg);
        background: white;
        font-size: 18px;
      }
      .vocab-list {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }
      .vocab-item {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .vocab-item summary {
        cursor: pointer;
        font-weight: bold;
      }
      .vocab-item p {
        margin-top: 10px;
        font-size: 14px;
      }
      .form-grid {
        display: grid;
        gap: 18px;
        margin: 22px 0;
      }
      .field label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 7px;
      }
      select {
        width: 100%;
        padding: 11px 35px 11px 12px;
        border: 1px solid #bfcdbb;
        border-radius: 10px;
        background: white;
        color: var(--ink);
        min-height: 48px;
      }
      .quiz-container {
        max-width: 810px;
        margin: auto;
      }
      .quiz-question {
        font-size: 21px;
        line-height: 1.7;
        margin: 24px 0;
      }
      .answers {
        display: grid;
        gap: 12px;
      }
      .answer {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        background: white;
        color: var(--ink);
        line-height: 1.65;
      }
      .answer:not(:disabled):hover {
        border-color: #759552;
        background: #f5f9ec;
      }
      .answer-letter {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        flex: none;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 7px;
      }
      .answer.correct {
        border-color: #5c8b57;
        background: #eef6e9;
      }
      .answer.wrong {
        border-color: #c26666;
        background: var(--red-bg);
      }
      .answer:disabled {
        opacity: 1;
      }
      .feedback {
        margin-top: 20px;
        border-radius: 12px;
        padding: 18px;
        background: var(--pale);
      }
      .feedback.wrong {
        background: var(--red-bg);
        color: #76282c;
      }
      .score-circle {
        width: 132px;
        height: 132px;
        border: 9px solid #d8e8bd;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0 auto 18px;
      }
      .score-circle strong {
        font-size: 32px;
        line-height: 1.3;
      }
      .result-head {
        text-align: center;
      }
      .result-stats {
        display: flex;
        justify-content: center;
        gap: 28px;
        margin: 18px 0;
      }
      .review-item {
        margin-top: 14px;
        padding: 20px;
        border: 1px solid #ead7cd;
        border-radius: 14px;
        background: #fffdf9;
      }
      .review-item .incorrect-text {
        color: var(--red);
      }
      .review-item p {
        font-size: 14px;
        margin-top: 8px;
      }
      .storage-alert {
        background: var(--amber-bg);
        padding: 12px 20px;
        color: #704c1a;
        font-size: 14px;
        border-bottom: 1px solid #dfc691;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 12px 20px;
        border-radius: 12px;
        z-index: 20;
        max-width: 90%;
        box-shadow: 0 4px 30px #0002;
        font-size: 14px;
      }
      .resume {
        background: #edf4e4;
      }
      .empty {
        text-align: center;
        padding: 30px;
      }
      .settings-grid {
        display: grid;
        gap: 20px;
      }
      .sources li {
        margin-bottom: 10px;
      }
      .sources a {
        overflow-wrap: anywhere;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 25px;
        width: min(440px, calc(100% - 32px));
        color: var(--ink);
      }
      dialog::backdrop {
        background: #10261db3;
      }
      dialog .row {
        justify-content: flex-end;
        margin-top: 24px;
      }
      @media (min-width: 600px) {
        .days-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .metrics {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .form-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .memory-legend {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .main {
          padding: 32px;
        }
        .hero {
          padding: 35px;
        }
        .lesson-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .lesson-grid .wide {
          grid-column: 1/-1;
        }
        .hero-art {
          display: block;
          position: absolute;
          right: 25px;
          top: 25px;
          opacity: 0.7;
          width: 160px;
          height: 160px;
        }
        .hero-copy {
          position: relative;
          max-width: 75%;
        }
        .settings-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (min-width: 1000px) {
        body {
          display: grid;
          grid-template-columns: 238px minmax(0, 1fr);
        }
        .sidebar {
          position: sticky;
          top: 0;
          height: 100vh;
          border-bottom: 0;
          border-right: 1px solid var(--line);
          padding: 30px 20px;
          display: flex;
          flex-direction: column;
        }
        .nav {
          flex-direction: column;
          overflow: visible;
          gap: 7px;
          margin-top: 12px;
        }
        .nav button {
          padding: 12px;
        }
        .nav .dayname {
          display: inline;
        }
        .nav .mobile-day {
          display: none;
        }
        .nav-label {
          display: block;
          color: #83917f;
          font-size: 10px;
          letter-spacing: 1.5px;
          margin: 44px 12px 0;
        }
        .nav .settings-link {
          margin: 26px 0 0;
        }
        .side-note {
          display: block;
          margin-top: auto;
          padding: 18px;
          background: #f0f3e8;
          border-radius: 13px;
          font-size: 12px;
          color: var(--muted);
        }
        .side-note strong {
          display: block;
          color: var(--green);
          margin: 8px 0 5px;
        }
        .topbar {
          padding: 18px 36px;
        }
        .days-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .hero-art {
          right: 60px;
        }
        .hero-copy {
          max-width: 70%;
        }
      }
      /* Dark appearance covers lessons, controls, feedback and dialogs as well as
         the dashboard. Screen-only overrides preserve the light print layout. */
      @media screen {
        html[data-theme="dark"] {
          color-scheme: dark;

      /* 4. Persistent state. A single namespaced record makes an answer + its statistics
     one localStorage write. A restored answer is locked, so reload cannot count it twice. */
      const STORAGE_KEY = "fibre-ready:v1";
      const byId = Object.fromEntries(QUESTION_BANK.map((q) => [q.id, q]));
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const freshState = () => ({
        version: 1,
        theme: "light",
        days: Object.fromEntries(
          DAYS.map((d) => [
            d.id,
            {
              read: false,
              seen: [],
              flashIndex: 0,
              best: 0,
              passed: false,
              attempts: 0,
            },
          ]),
        ),
        stats: {},
        active: null,
        history: [],
        view: "dashboard",
      });
      function storageWarning(message) {
        $("storage-alert").textContent = message;
        $("storage-alert").hidden = false;
      }
      function validSession(s) {
        if (
          !s ||
          !["daily", "mixed", "weak"].includes(s.mode) ||
          !Array.isArray(s.items) ||
          !s.items.length ||
          s.items.length > QUESTION_BANK.length
        )
          return false;
        if (
          !Number.isInteger(s.index) ||
          s.index < 0 ||
          s.index >= s.items.length ||
          !Number.isInteger(s.day) ||
          s.day < 1 ||
          s.day > 5
        )
          return false;
        if (new Set(s.items.map((x) => x.id)).size !== s.items.length)
          return false;
        if (
          !s.items.every(
            (x, i) =>
              byId[x.id] &&
              Array.isArray(x.order) &&
              x.order.length === 4 &&
              [0, 1, 2, 3].every((n) => x.order.includes(n)) &&
              (x.selected === null ||
                (Number.isInteger(x.selected) &&
                  x.selected >= 0 &&
                  x.selected < 4)) &&
              (i >= s.index || x.selected !== null),
          )
        )
          return false;
        if (s.mode === "daily" && s.items.some((x) => byId[x.id].day !== s.day))
          return false;
        if (s.finished && !s.items.every((x) => x.selected !== null))
          return false;
        return typeof s.finished === "boolean";
      }
      function loadState() {
        const base = freshState();
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return base;
          const data = JSON.parse(raw);
          if (data.version !== 1) throw new Error("version");
          base.theme = data.theme === "dark" ? "dark" : "light";
          for (const d of DAYS) {
            const v = data.days?.[d.id];
            if (!v) continue;
            const best = Number.isFinite(v.best)
              ? Math.max(0, Math.min(100, v.best))
              : 0;
            base.days[d.id] = {
              read: v.read === true,
              seen: Array.isArray(v.seen)
                ? [
                    ...new Set(
                      v.seen.filter(
                        (i) =>
                          Number.isInteger(i) && i >= 0 && i < d.vocab.length,
                      ),
                    ),
                  ]
                : [],
              flashIndex: Number.isInteger(v.flashIndex)
                ? Math.max(0, Math.min(d.vocab.length - 1, v.flashIndex))
                : 0,
              best,
              passed: best >= 80,
              attempts:
                Number.isInteger(v.attempts) && v.attempts >= 0
                  ? v.attempts
                  : 0,
            };
          }
          for (const q of QUESTION_BANK) {
            const s = data.stats?.[q.id];
            if (!s) continue;
            if (
              [s.correct, s.wrong, s.streak].every(
                (n) => Number.isInteger(n) && n >= 0,
              ) &&
              typeof s.lastCorrect === "boolean"
            )
              base.stats[q.id] = {
                correct: s.correct,
                wrong: s.wrong,
                streak: Math.min(s.streak, s.correct),
                lastCorrect: s.lastCorrect,
              };
          }
          if (validSession(data.active)) base.active = data.active;
          base.history = Array.isArray(data.history)
            ? data.history
                .filter(
                  (h) =>

        return `<div class="quiz-container stack"><div class="row between"><button class="btn text" data-route="dashboard">← พักไว้ กลับภาพรวม</button><span class="pill">${modeName(s.mode)}${s.mode === "daily" ? " · วันที่ " + s.day : ""}</span></div><section class="panel"><div class="row between small"><span class="muted">ข้อที่ ${s.index + 1} / ${s.items.length}</span><strong>${done} ข้อที่ตอบแล้ว</strong></div><div style="margin-top:12px">${progress((100 * done) / s.items.length, "จำนวนข้อที่ตอบแล้ว")}</div><div class="small muted" style="margin-top:22px">วันที่ ${q.day} · ${DAYS[q.day - 1].short}</div><h1 class="quiz-question" id="question-title" tabindex="-1">${esc(q.question)}</h1><div class="answers" role="group" aria-labelledby="question-title">${item.order.map((option, i) => `<button class="answer ${answered ? (option === q.answer ? "correct" : option === item.selected ? "wrong" : "") : ""}" data-answer="${option}" ${answered ? "disabled" : ""}><span class="answer-letter">${["ก", "ข", "ค", "ง"][i]}</span><span>${esc(q.options[option])}${answered && option === q.answer ? " <strong>✓ คำตอบที่ถูก</strong>" : answered && option === item.selected ? " <strong>✕ คำตอบของคุณ</strong>" : ""}</span></button>`).join("")}</div><div id="feedback-region" aria-live="polite">${answered ? feedback(q, correct) : ""}</div></section><p class="small muted">${answered ? "บันทึกคำตอบแล้ว หากกลับมาเปิดใหม่จะเริ่มที่ข้อนี้พร้อมเฉลย" : "เลือกได้ครั้งเดียวในแต่ละข้อ ระบบบันทึกเมื่อกดตอบทันที"} • พักเมื่อไรก็ได้</p></div>`;
      }
      function feedback(q, correct) {
        const last = state.active.index === state.active.items.length - 1;
        return `<div class="feedback ${correct ? "" : "wrong"}" tabindex="-1" id="answer-feedback"><strong>${correct ? "✓ ถูกต้อง" : "✕ ยังไม่ถูก ลองจำเหตุผลนี้ไว้"}</strong><p class="small" style="margin-top:8px"><strong>เฉลย:</strong> ${esc(q.options[q.answer])}</p><p style="margin-top:8px">${esc(q.explanation)}</p></div><div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn primary" data-action="next-question">${last ? "ดูสรุปผล" : "ข้อต่อไป"} ${icon("arrow")}</button></div>`;
      }
      function answerQuestion(answer) {
        const s = state.active;
        if (!s || s.finished) return;
        const item = s.items[s.index];
        if (item.selected !== null || ![0, 1, 2, 3].includes(answer)) return;
        const q = byId[item.id],
          correct = answer === q.answer;
        item.selected = answer;
        const old = state.stats[q.id] || {
          correct: 0,
          wrong: 0,
          streak: 0,
          lastCorrect: false,
        };
        state.stats[q.id] = {
          correct: old.correct + (correct ? 1 : 0),
          wrong: old.wrong + (correct ? 0 : 1),
          streak: correct ? old.streak + 1 : 0,
          lastCorrect: correct,
        };
        save();
        render(false);
        $("answer-feedback")?.focus({ preventScroll: true });
      }
      function scoreSession(s) {
        const correct = s.items.filter(
          (x) => x.selected === byId[x.id].answer,
        ).length;
        return {
          correct,
          wrong: s.items.length - correct,
          total: s.items.length,
          percent: (100 * correct) / s.items.length,
        };
      }
      function creditDay(s) {
        return s.mode === "daily"
          ? s.day
          : s.mode === "mixed" &&
              s.items.length >= 15 &&
              new Set(s.items.map((x) => byId[x.id].day)).size === 4
            ? 5
            : null;
      }
      function finishSession() {
        const s = state.active;
        if (!s || s.finished || s.items.some((x) => x.selected === null))
          return;
        const score = scoreSession(s),
          day = creditDay(s);
        s.finished = true;
        s.finishedAt = new Date().toISOString();
        if (day) {
          const d = state.days[day];
          d.best = Math.max(d.best, score.percent);
          d.passed = d.best >= 80;
          d.attempts++;
        }
        state.history.push({
          ...score,
          mode: s.mode,
          day: day || s.day,
          date: s.finishedAt,
        });
        state.history = state.history.slice(-20);
        save();
        go("results");
      }
      function nextQuestion() {
        const s = state.active;
        if (!s || s.finished || s.items[s.index].selected === null) return;
        if (s.index === s.items.length - 1) {
          finishSession();
          return;
        }
        s.index++;
        save();
        render(false);
        $("question-title")?.focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function results() {
        const s = state.active;
        if (!s?.finished)
          return '<div class="panel empty"><h2>ยังไม่มีผลแบบทดสอบที่จบแล้ว</h2><a class="btn" href="#dashboard">กลับภาพรวม</a></div>';
        const score = scoreSession(s),
          day = creditDay(s),
          wrong = s.items.filter((x) => x.selected !== byId[x.id].answer),
          pass = score.percent >= 80;
        return `<div class="quiz-container stack"><div class="row between"><a href="#dashboard">← กลับภาพรวม</a><span class="pill">${modeName(s.mode)}</span></div><section class="panel result-head"><div class="score-circle"><strong>${percentText(score.percent)}%</strong><span class="small muted">คะแนนชุดนี้</span></div><h1>${pass ? "เข้าใจมากขึ้นอีกก้าว!" : "เห็นจุดที่ต้องทบทวนแล้ว"}</h1><p class="muted" style="margin-top:12px">${day ? (pass ? `✓ ผ่านเกณฑ์วันที่ ${day}` : `ชุดนี้ยังไม่ถึงเกณฑ์ 80% ของวันที่ ${day}`) : "โหมดจุดอ่อนบันทึกสถิติการจำ โดยไม่เปลี่ยนคะแนนผ่านรายวัน"}</p><div class="result-stats"><span>ถูก <strong>${score.correct}</strong> ข้อ</span><span>ผิด <strong>${score.wrong}</strong> ข้อ</span><span>รวม <strong>${score.total}</strong> ข้อ</span></div>${day ? `<p class="small muted">คะแนนสูงสุดวันที่ ${day}: ${percentText(state.days[day].best)}% · ${state.days[day].passed ? "ผ่านแล้ว" : "ยังไม่ผ่าน"} (คะแนนสูงสุดไม่ลดเมื่อฝึกซ้ำ)</p>` : ""}<div class="row" style="justify-content:center;margin-top:22px"><button class="btn primary" data-action="retry">สุ่มชุดใหม่ ${icon("repeat")}</button><button class="btn" data-action="weak-setup">ฝึกจุดอ่อน</button><button class="btn" data-route="dashboard">กลับภาพรวม</button></div></section>${memoryPanel()}<section><h2>ทบทวนข้อที่ตอบผิด <span class="muted">(${wrong.length})</span></h2>${
          wrong.length
            ? wrong
                .map((item, i) => {
                  const q = byId[item.id];
                  return `<article class="review-item"><span class="small muted">ทบทวน ${i + 1} · วันที่ ${q.day}</span><h3 style="margin-top:8px">${esc(q.question)}</h3><p class="incorrect-text">✕ คุณตอบ: ${esc(q.options[item.selected])}</p><p><strong>✓ เฉลย: ${esc(q.options[q.answer])}</strong></p><p class="muted">${esc(q.explanation)}</p><a class="small" href="#day/${q.day}/content">กลับไปอ่านหัวข้อนี้ →</a></article>`;
                })
                .join("")
            : '<div class="panel empty" style="margin-top:15px">✓ ชุดนี้ตอบถูกทุกข้อ ลองกลับมาทำซ้ำวันถัดไปเพื่อทดสอบว่าจำได้ต่อเนื่อง</div>'
        }</section></div>`;
      }
      /* 6. Settings, navigation and events. Reset only removes this app's key. */
      function appearanceSettings() {
        return `<section class="panel"><h3>ธีมการแสดงผล</h3><p class="small muted" style="margin-top:10px">เลือกโทนที่อ่านสบายสำหรับคุณ ธีมจะใช้กับทุกหน้าและจำไว้เมื่อกลับมาเปิดใหม่</p><div class="field" style="max-width:340px;margin-top:18px"><label for="theme-select">เลือกธีม</label><select id="theme-select"><option value="light" ${state.theme === "light" ? "selected" : ""}>สว่าง (Light)</option><option value="dark" ${state.theme === "dark" ? "selected" : ""}>มืด (Dark)</option></select></div></section>`;
      }
      function settings() {
        return `<div class="page-head"><div><div class="eyebrow muted">YOUR LEARNING SPACE</div><h1>ตั้งค่าและวิธีใช้งาน</h1><p>จัดการข้อมูลการเรียน และรู้ที่มาของเนื้อหา</p></div></div><div class="stack"><div class="settings-grid"><section class="panel"><h3>ข้อมูลอยู่ในเบราว์เซอร์นี้</h3><p class="small muted" style="margin-top:12px">บันทึกการอ่าน คำศัพท์ คะแนนสูงสุด สถิติรายข้อ และแบบทดสอบที่ค้างผ่าน localStorage โดยอัตโนมัติ ไม่ต้องมีบัญชี</p><p class="small muted">ใช้ไฟล์เดิมและเบราว์เซอร์เดิมเพื่อกลับมาเรียนต่อ โหมดไม่ระบุตัวตน การล้างข้อมูลเว็บไซต์ หรือย้ายไฟล์/เปลี่ยนเบราว์เซอร์อาจทำให้เข้าถึงข้อมูลเดิมไม่ได้ ข้อมูลไม่ได้ซิงก์ข้ามอุปกรณ์</p></section><section class="panel"><h3>เริ่มแผนใหม่</h3><p class="small muted" style="margin:12px 0 20px">ลบความคืบหน้า คะแนน สถิติคำถาม และแบบทดสอบที่ค้างของแอปนี้ การลบไม่สามารถย้อนกลับได้</p><button class="btn danger" data-action="reset-all">รีเซ็ตข้อมูลทั้งหมด</button></section></div><section class="panel lesson"><h3>อ่าน progress และการจำอย่างไร</h3><ul><li>แต่ละวัน: อ่านจบ 25% + พลิกคำศัพท์ตามสัดส่วน 25% + คะแนนสูงสุดเทียบเกณฑ์ 80% อีก 50% รวมแล้วได้ progress ของวันนั้น และเฉลี่ย 5 วันเป็นภาพรวม</li><li>วันที่ 1–4 ผ่านจากโหมดฝึกตามวัน วันที่ 5 ผ่านจากโหมดรวบยอดอย่างน้อย 15 ข้อที่ครอบคลุมครบทั้ง 4 วัน ใช้เกณฑ์คะแนนจริง ≥ 80% และต้องทำจบชุด</li><li>ยังไม่ชำนาญ: ไม่เคยทำ หรือตอบล่าสุดผิด หรือยอดผิดสะสมมากกว่าถูก</li><li>กำลังจำได้: ตอบถูกต่อเนื่อง 1–2 ครั้ง และไม่ได้เข้าเงื่อนไขยังไม่ชำนาญ</li><li>จำได้แม่นแล้ว: ตอบถูกต่อเนื่องอย่างน้อย 3 ครั้ง และยอดถูกไม่น้อยกว่าผิด</li><li>น้ำหนักสุ่มต่อข้อคือ 6 : 3 : 1 ตามสามกลุ่ม ข้อที่แม่นยังมีโอกาสออก สุ่มโดยไม่ซ้ำในชุด หากเลือกทั้งหมดทุกข้อจะออกหนึ่งครั้ง</li><li>รวบยอดรับประกันอย่างน้อยหนึ่งข้อจากแต่ละวันก่อนสุ่มส่วนที่เหลือ และสลับลำดับทั้งหมด โหมดจุดอ่อนเลือกกลุ่ม ณ เวลาเริ่มชุด</li><li>ระบบนี้ทบทวนตามประวัติคำตอบ ไม่ได้ตั้งนัดเตือนตามเวลา ลองกลับมาทำอีกครั้งวันถัดไป</li></ul></section><section class="panel"><h3>ประวัติการฝึกล่าสุด</h3>${
          state.history.length
            ? `<div class="table-wrap"><table><caption>เก็บ 20 ชุดล่าสุดที่ทำจบ</caption><thead><tr><th scope="col">เวลา</th><th scope="col">โหมด</th><th scope="col">ถูก / ทั้งหมด</th><th scope="col">คะแนน</th></tr></thead><tbody>${[
                ...state.history,
              ]
                .reverse()
                .map(
                  (h) =>
                    `<tr><td>${esc(new Date(h.date).toLocaleString("th-TH"))}</td><td>${modeName(h.mode)}${h.mode === "daily" ? " วันที่ " + esc(h.day) : ""}</td><td>${esc(h.correct)} / ${h.total}</td><td>${percentText(h.percent)}%</td></tr>`,
                )
                .join("")}</tbody></table></div>`
            : '<p class="small muted" style="margin-top:12px">ยังไม่มีแบบทดสอบที่ทำจบ ลองเริ่มชุดแรกจากบทเรียนได้เลย</p>'
        }</section><section class="panel lesson"><h3>แหล่งอ้างอิงและขอบเขตเนื้อหา</h3><p class="small muted">เรียบเรียงเพื่อเตรียมตัวด้านพื้นฐาน ไม่ใช่ข้อสอบหรือขั้นตอนภายในของ AIS เมื่อทำงานจริงให้ยึดคู่มือรุ่นอุปกรณ์และกระบวนการองค์กร ลิงก์ด้านล่างต้องใช้อินเทอร์เน็ต แต่บทเรียนและข้อสอบทั้งหมดอยู่ในไฟล์นี้แล้ว</p><ul class="sources small"><li><a href="https://www.ais.th/consumers/help-and-support/fibre" target="_blank" rel="noopener noreferrer">AIS: ศูนย์ข้อมูลความรู้ Fibre ↗</a> — การตรวจอุปกรณ์และแนวทางแก้ปัญหา</li><li><a href="https://aiscallcenter.ais.co.th/fbbrouter/" target="_blank" rel="noopener noreferrer">AIS: สเปคและการตั้งค่าเราเตอร์แต่ละรุ่น ↗</a> — ใช้เทียบรุ่นจริงก่อนแปลไฟสถานะ</li><li><a href="https://www.tp-link.com/us/support/faq/497/" target="_blank" rel="noopener noreferrer">TP-Link: การคืนค่าโรงงานของ Router ↗</a> — ผลต่อค่าตั้งและขั้นตอนตามรุ่น</li><li><a href="https://service-provider.tp-link.com/ro/faq/323/" target="_blank" rel="noopener noreferrer">TP-Link: สัญญาณ WiFi ย่าน 5GHz ↗</a> — ระยะและสิ่งกีดขวาง</li><li><a href="https://www.cloudflare.com/learning/network-layer/how-does-the-internet-work/" target="_blank" rel="noopener noreferrer">Cloudflare: การทำงานของอินเทอร์เน็ต ↗</a> — packet และการค้นชื่อผ่าน DNS</li><li><a href="https://www.cloudflare.com/en-in/learning/performance/glossary/what-is-latency/" target="_blank" rel="noopener noreferrer">Cloudflare: Latency ↗</a> — เวลาหน่วงของข้อมูล</li></ul><p class="small muted">ตรวจข้อมูลอ้างอิง 8 กันยายน 2026 • เพิ่มหรือแก้เนื้อหาได้ในส่วน DAYS และ QUESTION_BANK ของไฟล์ HTML</p></section></div>`;
      }
      function go(route) {
        if (location.hash.slice(1) === route) render();
        else location.hash = route;
      }
      function render(focus = true) {
        applyTheme();
        let route = location.hash.slice(1) || "dashboard",
          body;
        const dayMatch = /^day\/([1-5])\/(content|vocab|quiz)$/.exec(route);
        if (dayMatch) body = dayPage(Number(dayMatch[1]), dayMatch[2]);
        else if (route === "settings") body = settings();
        else if (route === "run") body = quizRun();
        else if (route === "results") body = results();
        else {
          route = "dashboard";
          body = dashboard();
        }
        state.view = route;
        save();
        nav(route);
        $("main").innerHTML = body + footer();
        if (route === "settings") {
          $("main")
            .querySelector(".stack")
            .insertAdjacentHTML("afterbegin", appearanceSettings());
        }
        if (dayMatch && dayMatch[2] === "quiz") setupControls();
        document.title =
          (dayMatch
            ? `วันที่ ${dayMatch[1]} · ${DAYS[Number(dayMatch[1]) - 1].short}`
            : route === "settings"
              ? "ตั้งค่า"
              : route === "run"
                ? "แบบทดสอบ"
                : route === "results"
                  ? "ผลการฝึก"
                  : "ภาพรวม") + " — Fibre Ready";
        if (focus) {
          $("main").focus({ preventScroll: true });
          window.scrollTo({ top: 0, behavior: "instant" });
        }
      }
      // Pending setup allows the dashboard/results shortcut to open weakness controls.
      let pendingWeak = false;
      function openWeakSetup() {
        pendingWeak = true;
        const target = "day/5/quiz";
        if (location.hash.slice(1) === target) {
          render();
          applyPending();
        } else go(target);
      }
      function applyPending() {
        if (pendingWeak && $("quiz-mode")) {
          pendingWeak = false;
          quizConfig.mode = "weak";
          quizConfig.count = "10";
          setupControls();
        }
      }
      document.addEventListener("click", (event) => {
        const el = event.target.closest("button");
        if (!el || el.disabled) return;
        if (el.dataset.route) {
          go(el.dataset.route);
          return;
        }
        if (el.dataset.answer !== undefined) {
          answerQuestion(Number(el.dataset.answer));
          return;
        }
        switch (el.dataset.action) {
          case "read":
            state.days[currentDay].read = true;
            save();
            render(false);
            toast("บันทึกว่าอ่านจบแล้ว");
            break;
          case "flip":
            flip();
            break;
          case "flash-prev":
            moveFlash(-1);
            break;
          case "flash-next":
            moveFlash(1);
            break;
          case "start-quiz":
            startQuiz(quizConfig.mode, quizConfig.day, quizConfig.count);
            break;
          case "next-question":
            nextQuestion();
            break;
          case "comprehensive":
            startQuiz("mixed", 5, "20");
            break;
          case "weak-setup":
            openWeakSetup();
            break;
          case "retry": {
            const s = state.active;
            if (s) startQuiz(s.mode, s.day, String(s.items.length));
            break;
          }
          case "reset-all":
            confirmAction(
              "รีเซ็ตข้อมูลทั้งหมด?",
              "ความคืบหน้า คะแนน สถิติการจำ และชุดข้อสอบที่ค้างของ Fibre Ready จะถูกลบ โดยไม่กระทบข้อมูลแอปอื่น",
              () => {
                try {
                  localStorage.removeItem(STORAGE_KEY);
                } catch (error) {
                  storageWarning(
                    "ไม่สามารถลบข้อมูลที่บันทึกได้ กรุณาตรวจสิทธิ์พื้นที่เก็บข้อมูลของเบราว์เซอร์",
                  );
                  return;
                }
                state = freshState();
                pendingWeak = false;
                save();
                go("dashboard");
                toast("รีเซ็ตข้อมูลของ Fibre Ready แล้ว");
              },
            );
            break;
        }
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "theme-select") {
          state.theme = event.target.value === "dark" ? "dark" : "light";
          applyTheme();
          if (save())
            toast(
              state.theme === "dark"
                ? "บันทึกธีมมืดแล้ว"
                : "บันทึกธีมสว่างแล้ว",
            );
          return;
        }
        if (!event.target.id.startsWith("quiz-")) return;
        if (event.target.id === "quiz-mode")
          quizConfig.mode = event.target.value;
        if (event.target.id === "quiz-day")
          quizConfig.day = Number(event.target.value);
        if (event.target.id === "quiz-count")
          quizConfig.count = event.target.value;
        setupControls();
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.target.closest(".flashcard") &&
          ["ArrowLeft", "ArrowRight"].includes(event.key)
        ) {
          event.preventDefault();
          moveFlash(event.key === "ArrowLeft" ? -1 : 1);
        }
        const tab = event.target.closest('[role="tab"]');
        if (
          tab &&
          ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)
        ) {
          event.preventDefault();
          const keys = ["content", "vocab", "quiz"],
            index = keys.indexOf(currentTab),
            next =
              event.key === "Home"
                ? 0
                : event.key === "End"
                  ? 2
                  : (index + (event.key === "ArrowRight" ? 1 : 2)) % 3;
          go(`day/${currentDay}/${keys[next]}`);
          setTimeout(() => $("tab-" + keys[next])?.focus(), 0);
        }
      });
      window.addEventListener("hashchange", () => {
        render();
        applyPending();
      });
      // Save the last page, and keep a paused quiz even when reading another lesson.
      if (!location.hash && state.view !== "dashboard")
        location.hash = state.view;
      render(false);
    </script>
  </body>
</html>
