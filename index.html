<style>
  /* ================= THEME ================= */
  :root, :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f4f6f9;
    --bg-glow:rgba(47,111,237,.10);
    --head-bg:rgba(244,246,249,.88);
    --card:#ffffff;
    --card-2:#f7f9fc;
    --ink:#1c2430;
    --ink-soft:#4f5b6a;
    --ink-faint:#828d9b;
    --line:#e2e8f0;
    --brand:#2f6fed;
    --brand-soft:#eaf1ff;
    --ok:#0f9c6c;
    --ok-soft:#e6f7f0;
    --danger:#d93a3f;
    --danger-soft:#fdeced;
    --warn:#a8710a;
    --warn-soft:#fff5e2;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e1218;
    --bg-glow:rgba(111,155,255,.10);
    --head-bg:rgba(14,18,24,.86);
    --card:#171d26;
    --card-2:#1d242f;
    --ink:#e9eef5;
    --ink-soft:#aab6c4;
    --ink-faint:#7b8794;
    --line:#28313d;
    --brand:#6f9bff;
    --brand-soft:#1b2740;
    --ok:#3ecf96;
    --ok-soft:#12312a;
    --danger:#ff6b6f;
    --danger-soft:#2a1a1e;
    --warn:#e8b45a;
    --warn-soft:#2d2413;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="auto"]{
      color-scheme:dark;
      --bg:#0e1218;
      --bg-glow:rgba(111,155,255,.10);
      --head-bg:rgba(14,18,24,.86);
      --card:#171d26;
      --card-2:#1d242f;
      --ink:#e9eef5;
      --ink-soft:#aab6c4;
      --ink-faint:#7b8794;
      --line:#28313d;
      --brand:#6f9bff;
      --brand-soft:#1b2740;
      --ok:#3ecf96;
      --ok-soft:#12312a;
      --danger:#ff6b6f;
      --danger-soft:#2a1a1e;
      --warn:#e8b45a;
      --warn-soft:#2d2413;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
    }
  }

  /* ================= BASE ================= */
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    background-image:radial-gradient(900px 380px at 50% -140px, var(--bg-glow), transparent 70%);
    background-repeat:no-repeat;background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai","Sarabun",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.65;
    padding:0 0 72px;
    transition:background-color .2s,color .2s;
  }
  .wrap{max-width:840px;margin:0 auto;padding:0 14px}
  [hidden]{display:none !important}

  /* ================= HEADER ================= */
  header{
    position:sticky;top:0;z-index:30;
    background:var(--head-bg);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding-top:14px;
  }
  .htop{display:flex;align-items:flex-start;gap:10px}
  h1{font-size:1.15rem;margin:0 0 2px;letter-spacing:-.2px;flex:1;min-width:0}
  .sub{font-size:.8rem;color:var(--ink-faint);margin:0 0 12px}
  .totalbar{display:flex;align-items:center;gap:10px;padding-bottom:12px}
  .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;width:0%;border-radius:99px;background:var(--brand);transition:width .35s ease,background .3s}
  .bar.done > i{background:var(--ok)}
  .pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:.88rem;min-width:112px;text-align:right;color:var(--ink-soft)}
  .pct.done{color:var(--ok)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px}

  button.btn, a.btn{
    font:inherit;font-size:.8rem;
    padding:6px 12px;border-radius:99px;
    border:1px solid var(--line);background:var(--card-2);color:var(--ink-soft);
    cursor:pointer;box-shadow:var(--shadow);
    display:inline-flex;align-items:center;gap:6px;
    text-decoration:none;white-space:nowrap;
    transition:.15s;
  }
  button.btn:hover, a.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  button.btn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
  button.btn.primary, a.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.btn.primary:hover, a.btn.primary:hover{opacity:.9;background:var(--brand);color:#fff}
  button.btn:focus-visible, a.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  a.btn.glossary{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
  a.btn.glossary:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);opacity:.85}

  /* ================= HOME : SECTIONS ================= */
  section.sec{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin:14px 0;box-shadow:var(--shadow);overflow:hidden;transition:border-color .25s;
  }
  section.sec.complete{border-color:var(--ok)}
  .sec-head{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;user-select:none}
  .sec-head:hover{background:var(--brand-soft)}
  section.sec.complete .sec-head{background:var(--ok-soft)}
  .sec-title{flex:1;min-width:0}
  .sec-title b{display:block;font-size:1rem;line-height:1.35}
  .sec-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
  .sec-meta .bar{height:6px}
  .sec-meta .count{font-size:.74rem;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .chev{flex:none;width:20px;height:20px;color:var(--ink-faint);transition:transform .25s}
  section.sec.open .chev{transform:rotate(90deg)}
  .sec-body{display:none;padding:0 14px 10px;border-top:1px solid var(--line)}
  section.sec.open .sec-body{display:block}

  .sub-block{padding:10px 0;border-bottom:1px dashed var(--line)}
  .sub-block:last-child{border-bottom:0}
  .row{display:flex;align-items:flex-start;gap:10px}
  .sub-block > .row > label{font-weight:600;font-size:.94rem}
  .items{margin:8px 0 0 30px;display:flex;flex-direction:column;gap:6px}
  .sub-block.complete > .row > label{color:var(--ok)}

  .item{border:1px solid transparent;border-radius:10px;padding:6px 8px;transition:.15s}
  .item:hover{background:var(--card-2);border-color:var(--line)}
  .item .open-link{
    flex:1;min-width:0;text-align:left;font:inherit;font-size:.9rem;
    background:none;border:0;padding:0;color:var(--ink);cursor:pointer;
    display:flex;align-items:flex-start;gap:6px;
  }
  .item .open-link:hover{color:var(--brand)}
  .item .open-link .arrow{color:var(--ink-faint);flex:none;font-size:.85em;margin-top:.15em}
  .item .open-link:hover .arrow{color:var(--brand)}
  .item.checked .open-link{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--ok)}
  .preview{margin:2px 0 0 30px;font-size:.78rem;line-height:1.5;color:var(--ink-faint);
    display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ================= CHECKBOX ================= */
  input[type=checkbox]{
    flex:none;appearance:none;-webkit-appearance:none;
    width:20px;height:20px;margin:2px 0 0;
    border:2px solid var(--ink-faint);border-radius:6px;
    background:transparent;cursor:pointer;position:relative;transition:.15s;
  }
  input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
  input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  input[type=checkbox]:indeterminate{background:var(--brand);border-color:var(--brand)}
  input[type=checkbox]:indeterminate::after{content:"";position:absolute;left:3px;top:7px;width:10px;height:2px;background:#fff}
  input[type=checkbox]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  label{cursor:pointer;flex:1;min-width:0}

  /* ================= DETAIL VIEW ================= */
  .crumb{font-size:.76rem;color:var(--ink-faint);margin:0 0 4px}
  #detail article{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 16px;margin:14px 0;box-shadow:var(--shadow);
  }
  #detail h2{font-size:1.25rem;margin:0 0 4px;line-height:1.35}
  .lead{color:var(--ink-soft);font-size:.92rem;margin:0 0 4px}
  #detail h3{
    font-size:.98rem;margin:22px 0 8px;padding-left:10px;
    border-left:3px solid var(--brand);line-height:1.4;
  }
  #detail h3:first-of-type{margin-top:16px}
  #detail p{margin:8px 0;font-size:.92rem}
  #detail ul{margin:8px 0;padding-left:20px}
  #detail li{margin:5px 0;font-size:.92rem}
  #detail li > b{color:var(--ink)}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;
    background:var(--brand-soft);color:var(--brand);padding:1px 6px;border-radius:5px;
    white-space:nowrap;
  }
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0;
    border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:420px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--card-2);font-weight:600;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .tip,.warn-box{
    margin:14px 0;padding:11px 13px;border-radius:10px;font-size:.88rem;
    border:1px solid var(--line);
  }
  .tip{background:var(--brand-soft);border-color:transparent}
  .tip > b{color:var(--brand);display:block;margin-bottom:4px}
  .warn-box{background:var(--warn-soft);border-color:transparent}
  .warn-box > b{color:var(--warn);display:block;margin-bottom:4px}
  .tip ul,.warn-box ul{margin:6px 0 0;padding-left:18px}
  .tip li,.warn-box li{margin:4px 0;font-size:.88rem}

  .markread{
    display:flex;align-items:center;gap:10px;margin-top:22px;padding:12px 14px;
    border:1px dashed var(--line);border-radius:10px;background:var(--card-2);
  }
  .markread.on{border-color:var(--ok);background:var(--ok-soft)}
  .markread label{font-size:.9rem;font-weight:600}
  /* ---- โน้ตสรุปของผู้ใช้ ---- */
  .notes{margin-top:22px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);padding:12px 13px}
  .notes h4{margin:0 0 4px;font-size:.94rem;display:flex;align-items:center;gap:8px}
  .notes .hintline{margin:0 0 9px;font-size:.78rem;color:var(--ink-faint)}
  .notes textarea{
    display:block;width:100%;min-height:160px;resize:vertical;
    font:inherit;font-size:.9rem;line-height:1.65;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  }
  .notes textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .noterow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
  .saveflag{font-size:.75rem;color:var(--ink-faint);margin-left:auto;white-space:nowrap}
  .saveflag.on{color:var(--ok)}
  .badge{font-size:.72rem;flex:none;margin-left:4px}
  .pager{display:flex;gap:8px;justify-content:space-between;margin:14px 0 0}
  .pager .btn{flex:1;justify-content:center;text-align:center;font-size:.78rem;padding:9px 10px;line-height:1.35}
  .pager .btn:disabled{opacity:.4;cursor:not-allowed}
  .backrow{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px}

  footer{text-align:center;font-size:.75rem;color:var(--ink-faint);margin-top:26px}
  .fab{
    position:fixed;right:16px;bottom:16px;z-index:40;
    border-radius:99px;padding:10px 16px;font-size:.82rem;font-weight:600;
    background:var(--brand);color:#fff;border:0;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.3);
  }
  .fab:hover{opacity:.92}

  @media (max-width:480px){
    body{font-size:15px}
    h1{font-size:1rem}
    .items{margin-left:26px}
    .preview{margin-left:26px}
    .pct{min-width:96px;font-size:.8rem}
    #detail article{padding:16px 13px}
  }
</style>

<header>
  <div class="wrap">
    <!-- หน้าหลัก -->

<script>
/* =========================================================
   ข้อมูลเนื้อหา
   ========================================================= */
const DATA = [
{
  id:"s1", title:"1. ระบบ Network & Broadband",
  subs:[
  {
    id:"s1a", title:"1.1 Network Basics (LAN / WAN / Wireless)",
    items:[
    {
      id:"s1a1", t:"OSI Model 7 Layers",
      h:"โมเดล 7 ชั้นที่ใช้อธิบายการสื่อสารข้อมูล และใช้เป็นกรอบในการไล่หาสาเหตุของปัญหา",
      body:`
<p class="lead">OSI Model คือแบบจำลองอ้างอิง 7 ชั้นที่ ISO กำหนดขึ้น เพื่ออธิบายว่าข้อมูลถูกส่งจากแอปพลิเคชันหนึ่งไปยังอีกเครื่องหนึ่งผ่านขั้นตอนใดบ้าง ในงาน Support เราใช้มันเป็น "แผนที่" ในการไล่ปัญหาว่าอาการที่เจออยู่ชั้นไหน</p>

<h3>7 ชั้น จากล่างขึ้นบน</h3>
<div class="tblwrap"><table>
<tr><th>ชั้น</th><th>ชื่อ</th><th>หน้าที่</th><th>หน่วยข้อมูล / ตัวอย่าง</th></tr>
<tr><td>7</td><td>Application</td><td>บริการที่ผู้ใช้สัมผัสโดยตรง</td><td>HTTP, HTTPS, DNS, SMTP, FTP</td></tr>
<tr><td>6</td><td>Presentation</td><td>เข้ารหัส/ถอดรหัส บีบอัด แปลงรูปแบบ</td><td>SSL/TLS, JPEG, ASCII</td></tr>
<tr><td>5</td><td>Session</td><td>เปิด–ปิด–ควบคุมเซสชันการคุย</td><td>NetBIOS, RPC</td></tr>
<tr><td>4</td><td>Transport</td><td>ส่งข้อมูลปลายทางถึงปลายทาง, พอร์ต</td><td>TCP, UDP (Segment)</td></tr>
<tr><td>3</td><td>Network</td><td>กำหนดเส้นทางข้าม network ด้วย IP</td><td>IP, ICMP, Router (Packet)</td></tr>
<tr><td>2</td><td>Data Link</td><td>ส่งข้อมูลในวงเดียวกันด้วย MAC Address</td><td>Ethernet, VLAN, Switch (Frame)</td></tr>
<tr><td>1</td><td>Physical</td><td>สัญญาณไฟฟ้า/แสง/คลื่นวิทยุ และสายสัญญาณ</td><td>สาย UTP, ไฟเบอร์, RJ-45 (Bit)</td></tr>
</table></div>

<h3>เทียบกับ TCP/IP Model</h3>
<p>TCP/IP มี 4 ชั้น คือ Network Access (รวม L1+L2), Internet (L3), Transport (L4) และ Application (รวม L5–L7) เป็นโมเดลที่ใช้งานจริงบนอินเทอร์เน็ต ส่วน OSI ใช้เป็นกรอบอธิบายเชิงทฤษฎี</p>

<h3>ใช้จริงในงาน Support อย่างไร</h3>
<ul>
<li><b>ไล่จากล่างขึ้นบน (Bottom-up)</b> — เหมาะกับปัญหา "ใช้เน็ตไม่ได้เลย": เช็คสาย/ไฟสถานะ (L1) → ได้ IP ไหม/ping gateway ได้ไหม (L2–L3) → ping ออกเน็ตได้ไหม (L3–L4) → เปิดเว็บได้ไหม (L7)</li>
<li><b>ไล่จากบนลงล่าง (Top-down)</b> — เหมาะกับ "เน็ตใช้ได้ แต่โปรแกรมเดียวมีปัญหา" เริ่มจากตัวแอปก่อน</li>
<li>ผูกอาการกับชั้นให้ได้: สายหลุด = L1, VLAN ผิด/พอร์ตไม่ขึ้น = L2, IP ชนกัน/route ผิด = L3, ไฟร์วอลล์บล็อกพอร์ต = L4, เว็บเปิดไม่ขึ้นแต่ ping ได้ = L7 หรือ DNS</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"บอก 7 layer เรียงมาให้ฟังหน่อย" — ท่องให้ได้ทั้งขึ้นและลง จำประโยคช่วยจำ เช่น <i>All People Seem To Need Data Processing</i> (บนลงล่าง)</li>
<li>"Switch กับ Router ทำงานชั้นไหน" — Switch = Layer 2 (ใช้ MAC), Router = Layer 3 (ใช้ IP), ส่วน L3 Switch ทำ routing ได้ด้วย</li>
<li>"ปัญหานี้อยู่ชั้นไหน" — ตอบพร้อมเหตุผลว่าจะทดสอบยืนยันอย่างไร</li>
</ul></div>`
    },
    {
      id:"s1a2", t:"IP Address & Subnetting",
      h:"โครงสร้าง IPv4, Private/Public IP, Subnet mask, การคำนวณจำนวน host และความหมายของ 169.254.x.x",
      body:`
<p class="lead">IP Address คือหมายเลขประจำตัวของอุปกรณ์ในเครือข่าย ใช้ระบุว่า "ใคร" และ "อยู่วงไหน" ส่วน Subnet mask ใช้บอกว่าเลขส่วนไหนคือ Network และส่วนไหนคือ Host</p>

<h3>พื้นฐาน IPv4</h3>
<ul>
<li>ขนาด 32 บิต เขียนเป็น 4 ชุด (Octet) เช่น <code>192.168.1.10</code> แต่ละชุดมีค่า 0–255</li>
<li>ประกอบด้วย 2 ส่วนเสมอ คือ <b>Network part</b> และ <b>Host part</b> แบ่งด้วย Subnet mask</li>
<li>ในแต่ละวง จะมี 2 เลขที่ใช้กับเครื่องไม่ได้: เลขแรก = <b>Network address</b>, เลขสุดท้าย = <b>Broadcast address</b></li>
<li><b>Default Gateway</b> คือ IP ของเราเตอร์ ใช้เป็นทางออกไปวงอื่น/อินเทอร์เน็ต</li>
<li>IPv6 ขนาด 128 บิต เขียนเป็นเลขฐานสิบหก เช่น <code>2001:db8::1</code> เกิดมาเพื่อแก้ปัญหา IPv4 ไม่พอ</li>
</ul>

<h3>ช่วง IP ที่ต้องจำ</h3>
<div class="tblwrap"><table>
<tr><th>ช่วง</th><th>ประเภท</th><th>ใช้ทำอะไร</th></tr>
<tr><td>10.0.0.0 – 10.255.255.255 (/8)</td><td>Private</td><td>ใช้ในองค์กรขนาดใหญ่</td></tr>
<tr><td>172.16.0.0 – 172.31.255.255 (/12)</td><td>Private</td><td>ใช้ในองค์กรขนาดกลาง</td></tr>
<tr><td>192.168.0.0 – 192.168.255.255 (/16)</td><td>Private</td><td>เจอบ่อยที่สุดตามบ้าน/สำนักงานเล็ก</td></tr>
<tr><td>127.0.0.0/8</td><td>Loopback</td><td>ทดสอบ TCP/IP ในเครื่องตัวเอง</td></tr>
<tr><td>169.254.0.0/16</td><td>APIPA</td><td>เครื่องตั้งเองเมื่อ <b>ขอ IP จาก DHCP ไม่ได้</b></td></tr>
</table></div>
<p>Private IP ออกอินเทอร์เน็ตตรง ๆ ไม่ได้ ต้องผ่าน NAT ที่เราเตอร์แปลงเป็น Public IP ก่อน</p>

<h3>Subnet mask / CIDR ที่ใช้บ่อย</h3>
<div class="tblwrap"><table>
<tr><th>CIDR</th><th>Subnet mask</th><th>จำนวน IP</th><th>ใช้ได้จริง</th><th>เจอที่ไหน</th></tr>
<tr><td>/24</td><td>255.255.255.0</td><td>256</td><td>254</td><td>วง LAN ทั่วไป</td></tr>
<tr><td>/25</td><td>255.255.255.128</td><td>128</td><td>126</td><td>ซอยวงย่อย</td></tr>
<tr><td>/26</td><td>255.255.255.192</td><td>64</td><td>62</td><td>แผนกเล็ก</td></tr>
<tr><td>/27</td><td>255.255.255.224</td><td>32</td><td>30</td><td>วง server/กล้อง</td></tr>
<tr><td>/30</td><td>255.255.255.252</td><td>4</td><td>2</td><td>เชื่อมเราเตอร์ 2 ตัว (WAN link)</td></tr>
</table></div>
<p>สูตรง่าย ๆ: จำนวน IP = 2 ยกกำลัง (32 − เลข CIDR) แล้วลบ 2 คือจำนวนที่ใช้กับเครื่องได้จริง</p>

<h3>ตัวอย่างการอ่าน</h3>
<p>เครื่องได้ <code>192.168.1.50 / 255.255.255.0</code> แปลว่าอยู่วง <b>192.168.1.0</b> ใช้ IP ได้ตั้งแต่ .1 ถึง .254 โดย .0 เป็น Network และ .255 เป็น Broadcast ถ้าอีกเครื่องเป็น 192.168.2.50 จะถือว่าคนละวง ต้องวิ่งผ่าน Gateway ถึงจะคุยกันได้</p>

<div class="warn-box"><b>⚠️ อาการที่ต้องจับให้ได้</b>
<ul>
<li>ได้ IP <b>169.254.x.x</b> = ติดต่อ DHCP ไม่ได้ (สายหลุด, สวิตช์/VLAN ผิด, DHCP ล่ม หรือ IP ในพูลหมด)</li>
<li>IP ชนกัน (IP conflict) = มีคนตั้ง Static ทับกับที่ DHCP แจก ทำให้เน็ตติด ๆ ดับ ๆ</li>
<li>Subnet mask ผิด = คุยในวงเดียวกันได้ แต่ออกเน็ตไม่ได้ หรือมองไม่เห็นบางเครื่อง</li>
</ul></div>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"Private IP กับ Public IP ต่างกันอย่างไร" และ "192.168.1.0/24 ใช้ได้กี่เครื่อง" (ตอบ 254)</li>
<li>"เครื่องได้ IP 169.254.1.20 คุณจะทำอะไรต่อ" — ตอบเป็นลำดับ: เช็คสาย/ไฟพอร์ต → <code>ipconfig /release</code> และ <code>/renew</code> → ตรวจ DHCP บนเราเตอร์ → ทดสอบตั้ง Static ชั่วคราวเพื่อพิสูจน์</li>
</ul></div>`
    },
    {
      id:"s1a3", t:"Protocols สำคัญ (DHCP, DNS, NAT, TCP vs UDP)",
      h:"โปรโตคอลที่เจอทุกวันในงาน Support พร้อมพอร์ตมาตรฐานและอาการเมื่อแต่ละตัวมีปัญหา",
      body:`
<h3>DHCP — แจก IP อัตโนมัติ</h3>
<ul>
<li>ทำงานแบบ <b>DORA</b>: Discover (เครื่องร้องหา) → Offer (เซิร์ฟเวอร์เสนอ IP) → Request (เครื่องขอใช้) → Acknowledge (ยืนยัน)</li>
<li>ใช้ UDP พอร์ต <b>67</b> (เซิร์ฟเวอร์) และ <b>68</b> (ไคลเอนต์)</li>
<li>สิ่งที่แจกมาด้วยกัน: IP, Subnet mask, Default Gateway, DNS Server, Lease time (อายุการใช้งาน IP)</li>
<li><b>DHCP Reservation</b> = ผูก MAC กับ IP เดิมทุกครั้ง เหมาะกับปรินเตอร์/กล้อง ดีกว่าตั้ง Static ที่เครื่องเพราะจัดการรวมศูนย์ได้</li>
<li>อาการเสีย: ได้ 169.254.x.x, หรือมี DHCP ซ้อนกัน 2 ตัวในวง (Rogue DHCP) ทำให้บางเครื่องได้ IP ผิดวง</li>
</ul>

<h3>DNS — แปลงชื่อเป็น IP</h3>
<ul>
<li>ใช้พอร์ต <b>53</b> (ปกติ UDP, ใช้ TCP เมื่อข้อมูลใหญ่หรือ zone transfer)</li>
<li>ชนิดเรคคอร์ดที่ควรรู้: <b>A</b> (ชื่อ→IPv4), <b>AAAA</b> (→IPv6), <b>CNAME</b> (ชื่อแทน), <b>MX</b> (เมลเซิร์ฟเวอร์), <b>PTR</b> (IP→ชื่อ), <b>TXT</b> (SPF/ยืนยันโดเมน), <b>NS</b></li>
<li>ลำดับการหาชื่อของเครื่อง: ไฟล์ hosts → DNS cache ในเครื่อง → DNS server ที่ตั้งไว้ → ไล่ถามขึ้นไปตามลำดับชั้น</li>
<li>อาการเสียคลาสสิก: <b>ping 8.8.8.8 ได้ แต่ ping google.com ไม่ได้</b> = ปัญหา DNS ล้วน ๆ</li>
<li>แก้เบื้องต้น: <code>ipconfig /flushdns</code> หรือเปลี่ยน DNS เป็น 8.8.8.8 (Google) / 1.1.1.1 (Cloudflare)</li>
</ul>

<h3>NAT — แปลง Private เป็น Public</h3>
<ul>
<li>ทำให้หลายเครื่องในบ้านใช้ Public IP เดียวออกเน็ตร่วมกัน (แบบที่ใช้จริงคือ <b>PAT / NAT Overload</b> ซึ่งแยกกันด้วยหมายเลขพอร์ต)</li>
<li><b>Port Forwarding</b> = เปิดทางให้คนข้างนอกเข้ามาหาเครื่องข้างใน เช่น เปิดพอร์ตดูกล้องวงจรปิด</li>
<li><b>Double NAT</b> = มีเราเตอร์ทำ NAT ซ้อนกัน 2 ชั้น (เช่น ONU ของ ISP + เราเตอร์ลูกค้า) ทำให้ port forward ไม่ทำงาน แก้ด้วยการตั้งตัวหน้าเป็น Bridge mode</li>
</ul>

<h3>TCP vs UDP</h3>
<div class="tblwrap"><table>
<tr><th>หัวข้อ</th><th>TCP</th><th>UDP</th></tr>
<tr><td>ลักษณะ</td><td>Connection-oriented</td><td>Connectionless</td></tr>
<tr><td>เริ่มการเชื่อมต่อ</td><td>3-way handshake (SYN → SYN-ACK → ACK)</td><td>ส่งได้เลย ไม่มีการจับมือ</td></tr>
<tr><td>ความน่าเชื่อถือ</td><td>ตรวจสอบ/ส่งซ้ำ/เรียงลำดับให้</td><td>ไม่การันตี อาจหายหรือสลับลำดับ</td></tr>
<tr><td>ความเร็ว/overhead</td><td>ช้ากว่า header 20 ไบต์</td><td>เร็วกว่า header 8 ไบต์</td></tr>
<tr><td>ใช้กับ</td><td>เว็บ, อีเมล, โอนไฟล์, ฐานข้อมูล</td><td>VoIP, วิดีโอสตรีม, เกม, DNS, DHCP</td></tr>
</table></div>

<h3>พอร์ตมาตรฐานที่ควรจำ</h3>
<div class="tblwrap"><table>
<tr><th>พอร์ต</th><th>บริการ</th><th>พอร์ต</th><th>บริการ</th></tr>
<tr><td>20/21</td><td>FTP</td><td>143 / 993</td><td>IMAP / IMAPS</td></tr>
<tr><td>22</td><td>SSH</td><td>161</td><td>SNMP</td></tr>
<tr><td>23</td><td>Telnet</td><td>389</td><td>LDAP</td></tr>
<tr><td>25 / 587 / 465</td><td>SMTP / Submission / SMTPS</td><td>443</td><td>HTTPS</td></tr>
<tr><td>53</td><td>DNS</td><td>445</td><td>SMB (แชร์ไฟล์/ปรินเตอร์)</td></tr>
<tr><td>67/68</td><td>DHCP</td><td>3389</td><td>RDP (Remote Desktop)</td></tr>
<tr><td>80</td><td>HTTP</td><td>110 / 995</td><td>POP3 / POP3S</td></tr>
</table></div>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"อธิบาย DHCP 4 ขั้นตอน" และ "ถ้า DHCP ล่ม ผู้ใช้จะเห็นอาการอะไร"</li>
<li>"ทำไม VoIP ถึงใช้ UDP" — เพราะยอมให้ข้อมูลหายบางส่วนได้ แต่ต้องการความหน่วงต่ำ ถ้าส่งซ้ำแบบ TCP เสียงจะดีเลย์</li>
<li>"HTTP กับ HTTPS ใช้พอร์ตอะไร" — 80 และ 443</li>
</ul></div>`

    {
      id:"s1a4", t:"LAN vs WAN",
      h:"ความต่างของเครือข่ายภายในกับเครือข่ายข้ามพื้นที่ และการแบ่งความรับผิดชอบระหว่างเรากับ ISP",
      body:`
<p class="lead">LAN (Local Area Network) คือเครือข่ายภายในพื้นที่จำกัด ส่วน WAN (Wide Area Network) คือการเชื่อมเครือข่ายข้ามพื้นที่ผ่านผู้ให้บริการ การแยกให้ออกว่าปัญหาอยู่ฝั่ง LAN หรือ WAN คือหัวใจของการตัดสินใจว่าจะแก้เองหรือแจ้ง ISP</p>

<h3>เปรียบเทียบ</h3>
<div class="tblwrap"><table>
<tr><th>หัวข้อ</th><th>LAN</th><th>WAN</th></tr>
<tr><td>ขอบเขต</td><td>ในบ้าน อาคาร สำนักงาน</td><td>ข้ามเมือง ข้ามประเทศ</td></tr>
<tr><td>เจ้าของ/ผู้ดูแล</td><td>องค์กรหรือผู้ใช้เอง</td><td>ผู้ให้บริการ (ISP / Telecom)</td></tr>
<tr><td>ความเร็ว</td><td>สูง (1–10 Gbps)</td><td>ต่ำกว่า ขึ้นกับแพ็กเกจที่เช่า</td></tr>
<tr><td>ความหน่วง (Latency)</td><td>ต่ำมาก (&lt;1 ms)</td><td>สูงกว่า (หลาย ms ขึ้นไป)</td></tr>
<tr><td>เทคโนโลยี</td><td>Ethernet, Wi-Fi, Switch</td><td>FTTx, Leased Line, MPLS, 4G/5G, VPN</td></tr>
<tr><td>ค่าใช้จ่าย</td><td>ลงทุนครั้งเดียว</td><td>จ่ายรายเดือนตามสัญญา</td></tr>
</table></div>

<h3>มองจากตัวเราเตอร์</h3>
<ul>
<li><b>พอร์ต WAN</b> (มักสีต่างจากพอร์ตอื่น) ต่อออกไปหาโมเด็ม/ONU ของ ISP — ฝั่งนี้คือ WAN</li>
<li><b>พอร์ต LAN</b> ต่อกับสวิตช์/คอมพิวเตอร์ภายใน — ฝั่งนี้คือ LAN และมักเป็นวง Private IP</li>
<li>ตัวกลางที่ทำหน้าที่เชื่อม 2 ฝั่งนี้คือ NAT + Routing</li>
</ul>

<h3>ใช้แยกปัญหาอย่างไร</h3>
<ul>
<li>เครื่องในวงคุยกันเองได้ + ping gateway ได้ แต่ออกเน็ตไม่ได้ → ปัญหาอยู่ <b>ฝั่ง WAN</b> (สายสัญญาณเข้าอาคาร, PPPoE, ค้างชำระ, ISP ล่ม)</li>
<li>ออกเน็ตได้บางเครื่อง แต่บางเครื่องไม่ได้ → ปัญหาอยู่ <b>ฝั่ง LAN</b> (สาย, สวิตช์, Wi-Fi, IP, การตั้งค่าเครื่องนั้น)</li>
<li>คำศัพท์ใกล้เคียงที่ควรตอบได้: <b>MAN</b> (ระดับเมือง), <b>WLAN</b> (LAN แบบไร้สาย), <b>VPN</b> (ต่อ LAN ข้ามผ่าน WAN อย่างปลอดภัย)</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"LAN กับ WAN ต่างกันอย่างไร" — ตอบด้วย ขอบเขต + ผู้ดูแล + ความเร็ว จะได้ครบมิติ</li>
<li>"ถ้าลูกค้าบอกเน็ตช้า คุณจะดูอย่างไรว่าเป็นที่ LAN หรือ WAN" — ทดสอบ speedtest ต่อสายตรงจากเราเตอร์เทียบกับผ่าน Wi-Fi และเทียบหลายเครื่อง</li>
</ul></div>`
    }]

    {
      id:"s1b1", t:"ADSL & FTTH",
      h:"เทคโนโลยีอินเทอร์เน็ตบ้าน: สายทองแดงแบบเดิม กับไฟเบอร์ยุคปัจจุบัน และอุปกรณ์ปลายทางที่ต่างกัน",
      body:`
<h3>ADSL (สายโทรศัพท์ทองแดง)</h3>
<ul>
<li><b>Asymmetric</b> = ดาวน์โหลดเร็วกว่าอัปโหลด เช่น 10/1 Mbps เพราะออกแบบมาให้เหมาะกับการเปิดเว็บ</li>
<li>วิ่งบนสายโทรศัพท์เดิม ต้องใช้ <b>Splitter / Microfilter</b> แยกสัญญาณเสียงกับข้อมูล ไม่งั้นจะมีเสียงรบกวนและเน็ตหลุด</li>
<li><b>ระยะทางมีผลมาก</b> ยิ่งไกลชุมสายยิ่งช้าและหลุดบ่อย (สัญญาณ attenuation สูง, SNR margin ต่ำ)</li>
<li>ADSL2+ สูงสุดราว 24 Mbps ดาวน์โหลด ส่วน VDSL2 เร็วขึ้นแต่ต้องอยู่ใกล้ตู้</li>
<li>อุปกรณ์ปลายทางคือ <b>ADSL Modem/Router</b> ต้องตั้งค่า VPI/VCI ตามที่ ISP กำหนด</li>
</ul>

<h3>FTTH / FTTx (ไฟเบอร์ออปติก)</h3>
<ul>
<li>ลากไฟเบอร์ถึงบ้าน ใช้เทคโนโลยี <b>GPON</b> เป็นหลัก แบ่งสัญญาณด้วย Splitter แบบพาสซีฟจากชุมสาย</li>
<li>อุปกรณ์ปลายทางคือ <b>ONU / ONT</b> (Optical Network Unit/Terminal) ทำหน้าที่แปลงแสงเป็นสัญญาณไฟฟ้า ปัจจุบันมักรวมเราเตอร์ + Wi-Fi มาในตัวเดียว</li>
<li>ความเร็วสูงกว่ามาก มีแพ็กเกจ Symmetric (ขึ้น-ลงเท่ากัน) ระยะทางแทบไม่มีผลต่อคุณภาพ และทนสัญญาณรบกวนทางไฟฟ้า</li>
<li>สายไฟเบอร์ห้ามหักงอเกินรัศมีที่กำหนด หัวต่อ <b>SC/APC (หัวเขียว)</b> กับ <b>SC/UPC (หัวน้ำเงิน)</b> ใช้สลับกันไม่ได้ ปลายหัวสกปรกหรือมีฝุ่นก็ทำให้สัญญาณตกได้</li>
</ul>

<h3>เทียบกันชัด ๆ</h3>

<tr><th>หัวข้อ</th><th>ADSL</th><th>FTTH</th></tr>

<tr><td>ผลของระยะทาง</td><td>มีผลมาก</td><td>แทบไม่มีผล</td></tr>
<tr><td>สัญญาณรบกวน</td><td>โดนคลื่นไฟฟ้ารบกวนง่าย</td><td>ไม่โดนรบกวนทางไฟฟ้า</td></tr>
<tr><td>อุปกรณ์ปลายทาง</td><td>ADSL Modem + Splitter</td><td>ONU / ONT</td></tr>

<h3>ทำไมต้องใช้</h3>
<ul>
<li><b>ความปลอดภัย</b> — แยกวงบัญชี/HR/แขก ออกจากกัน กำหนดสิทธิ์ผ่าน firewall ได้ชัดเจน</li>
<li><b>ลด Broadcast</b> — แต่ละ VLAN เป็น broadcast domain ของตัวเอง เครือข่ายใหญ่จึงไม่ช้าเพราะ broadcast ท่วม</li>
<li><b>จัดกลุ่มตามหน้าที่ ไม่ใช่ตามที่ตั้ง</b> — คนละชั้นตึกอยู่ VLAN เดียวกันได้</li>
<li>งาน ISP ใช้แยกบริการบนสายเส้นเดียว เช่น VLAN สำหรับ Internet, IPTV และ VoIP คนละ ID กัน</li>
</ul>

<h3>ศัพท์ที่ต้องแม่น</h3>
<div class="tblwrap"><table>
<tr><th>คำ</th><th>ความหมาย</th></tr>
<tr><td>802.1Q</td><td>มาตรฐานการใส่ tag ขนาด 4 ไบต์ลงในเฟรม เพื่อระบุว่าเป็นของ VLAN ไหน</td></tr>
<tr><td>VLAN ID</td><td>เลข 1–4094 (ค่าเริ่มต้นของสวิตช์คือ VLAN 1)</td></tr>
<tr><td>Access Port</td><td>พอร์ตที่ต่อกับอุปกรณ์ปลายทาง อยู่ได้ VLAN เดียว ส่งเฟรมออกแบบไม่มี tag</td></tr>
<tr><td>Trunk Port</td><td>พอร์ตเชื่อมระหว่างสวิตช์/เราเตอร์ ส่งได้หลาย VLAN โดยใส่ tag กำกับ</td></tr>
<tr><td>Native VLAN</td><td>VLAN ที่วิ่งบน trunk แบบไม่ใส่ tag ต้องตั้งให้ตรงกันทั้งสองฝั่ง</td></tr>
<tr><td>Inter-VLAN Routing</td><td>การให้ VLAN คุยกันได้ ทำที่ L3 Switch (SVI) หรือ Router-on-a-stick</td></tr>
</table></div>

<h3>อาการเมื่อ VLAN ผิด</h3>
<ul>
<li>เสียบสายแล้วไฟพอร์ตติด แต่ไม่ได้รับ IP (ได้ 169.254.x.x) เพราะพอร์ตอยู่คนละ VLAN กับ DHCP</li>
<li>ได้ IP แต่เป็นวงผิด เช่น ควรได้วงออฟฟิศแต่ได้วงแขก</li>

<li>ตั้ง native VLAN ไม่ตรงกันสองฝั่ง ทำให้ทราฟฟิกบางส่วนหาย</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>

</ul></div>`

<ul>

<h3>เคล็ดการติดตั้ง</h3>
<ul>
<li>วางที่จุด "กึ่งกลาง" ระหว่างเราเตอร์กับพื้นที่อับ โดยจุดนั้นต้องยังรับสัญญาณเดิมได้ราว 50% ขึ้นไป</li>
<li>ตั้ง SSID เดียวกันเพื่อให้สลับอัตโนมัติ หรือแยกชื่อ (เช่นเติม _EXT) เพื่อให้เลือกเองได้ชัดเจน</li>
<li>ถ้าเป็นไปได้ แนะนำ <b>AP Mode + สาย LAN</b> หรือระบบ <b>Mesh</b> (มี backhaul แยก) ซึ่งให้ผลดีกว่ามาก</li>
</ul>`
    },
    {
      id:"s2a4", t:"Bridge Mode",
      h:"ปิดการทำ Router ให้อุปกรณ์เป็นแค่ทางผ่าน มักใช้ตั้งที่ ONU เพื่อให้เราเตอร์ลูกค้าหมุนเน็ตเอง",
      body:`
<p class="lead">Bridge Mode คือการปิดฟังก์ชัน Routing/NAT ให้อุปกรณ์ทำหน้าที่เพียงส่งผ่านข้อมูลระดับ Layer 2 เท่านั้น</p>

<h3>เคสที่ใช้จริงบ่อยที่สุด</h3>
<p>ตั้ง <b>ONU/โมเด็มของ ISP ให้เป็น Bridge</b> แล้วให้เราเตอร์ของลูกค้าเป็นตัวหมุน PPPoE เอง ผลคือ Public IP มาอยู่ที่เราเตอร์ลูกค้าโดยตรง จึงไม่มี Double NAT ทำ Port Forwarding, VPN และ DDNS ได้ตามปกติ และลูกค้าได้ใช้ฟีเจอร์ของเราเตอร์ตัวเก่งเต็มที่</p>

<h3>ประเภทที่มักสับสน</h3>
<div class="tblwrap"><table>
<tr><th>โหมด</th><th>ลักษณะงาน</th></tr>
<tr><td>Bridge (โมเด็ม/ONU)</td><td>ส่งผ่านอย่างเดียว ไม่ทำ NAT/DHCP ให้ตัวหลังหมุนเน็ตเอง</td></tr>
<tr><td>Wireless Bridge / WDS</td><td>ใช้ Wi-Fi เชื่อมสองจุดเข้าด้วยกันแทนการเดินสาย</td></tr>
<tr><td>Client Bridge</td><td>ให้อุปกรณ์รับ Wi-Fi แล้วแปลงออกเป็นสาย LAN ให้เครื่องที่ไม่มี Wi-Fi ใช้</td></tr>
</table></div>

<div class="warn-box"><b>⚠️ ข้อควรระวัง</b>
<ul>
<li>เมื่อตั้ง Bridge แล้ว ถ้าไม่มีอุปกรณ์ตัวหลังหมุน PPPoE จะใช้เน็ตไม่ได้ทันที</li>
<li>หน้าเว็บตั้งค่าของ ONU อาจเข้าไม่ได้ตามปกติหลังเปลี่ยนโหมด ต้องรู้วิธีเข้าแบบเฉพาะหรือ reset</li>
<li>ต้องมี username/password PPPoE ของลูกค้าอยู่กับตัวก่อนเปลี่ยนโหมดเสมอ</li>
</ul></div>`

      id:"s2b1", t:"2.4GHz vs 5GHz",
      h:"ความต่างของสองย่านความถี่ เรื่องระยะทาง ความเร็ว การทะลุทะลวง และการเลือกช่องสัญญาณ",
      body:`
<div class="tblwrap"><table>
<tr><th>หัวข้อ</th><th>2.4 GHz</th><th>5 GHz</th></tr>
<tr><td>ระยะทาง</td><td>ไกลกว่า</td><td>สั้นกว่า</td></tr>
<tr><td>ทะลุกำแพง</td><td>ดีกว่า</td><td>แย่กว่า</td></tr>
<tr><td>ความเร็ว</td><td>ต่ำกว่า</td><td>สูงกว่ามาก</td></tr>
<tr><td>สัญญาณรบกวน</td><td>เยอะ (ไมโครเวฟ, Bluetooth, กล้องไร้สาย, เพื่อนบ้าน)</td><td>น้อยกว่า</td></tr>
<tr><td>จำนวนช่อง</td><td>น้อย ทับซ้อนกัน</td><td>เยอะ ไม่ค่อยทับซ้อน</td></tr>
<tr><td>เหมาะกับ</td><td>อุปกรณ์ IoT, พื้นที่กว้าง, ห่างเราเตอร์</td><td>ดูวิดีโอ 4K, ประชุมออนไลน์, เล่นเกม, อยู่ใกล้เราเตอร์</td></tr>
</table></div>

<h3>เรื่องช่องสัญญาณ (Channel)</h3>
<ul>
<li>2.4 GHz ในไทยใช้ช่อง 1–13 แต่ช่องที่ <b>ไม่ทับซ้อนกันคือ 1, 6, 11</b> ควรตั้งให้ AP ที่อยู่ใกล้กันใช้ช่องเหล่านี้สลับกัน</li>
<li>ในที่คนเยอะ อย่าตั้ง 2.4 GHz เป็นความกว้าง 40 MHz เพราะยิ่งกวนกันหนัก ใช้ 20 MHz จะนิ่งกว่า</li>
<li>5 GHz มีหลายกลุ่มช่อง (36–64, 100–140, 149–165) บางช่วงเป็น <b>DFS</b> ซึ่งต้องหลบสัญญาณเรดาร์ อาจทำให้ Wi-Fi หลุดชั่วครู่เมื่อตรวจพบเรดาร์</li>
<li>อุปกรณ์เก่าบางรุ่นมองไม่เห็นย่าน 5 GHz — ถ้าลูกค้าบอก "หาชื่อ Wi-Fi ไม่เจอ" ให้เช็คว่าอุปกรณ์รองรับย่านนั้นไหม</li>
</ul>

<h3>Band Steering / แยก SSID</h3>
<p>เราเตอร์รุ่นใหม่มักรวมสองย่านไว้ชื่อเดียว (Band Steering) แล้วเลือกให้อัตโนมัติ ข้อดีคือสะดวก ข้อเสียคือบางอุปกรณ์เกาะ 2.4 GHz ไม่ยอมย้าย เวลาต้องทดสอบให้แน่ใจ แนะนำแยก SSID ชั่วคราว เช่น <code>HOME</code> และ <code>HOME_5G</code></p>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"ลูกค้าบอกอยู่ห้องนอนแล้วเน็ตช้า จะแนะนำอะไร" — ตอบเชิงระบบ: ตรวจความแรงสัญญาณ, ย้ายไป 2.4 GHz สำหรับระยะไกล, เปลี่ยนช่องที่ไม่ชนเพื่อนบ้าน, ย้ายจุดวางเราเตอร์ให้สูงและโล่ง, ถ้ายังไม่พอค่อยเสนอ AP เพิ่มหรือ Mesh</li>
</ul></div>`

      h:"มาตรฐาน Wi-Fi แต่ละรุ่น ความเร็ว ย่านความถี่ และเทคโนโลยีเด่นที่ควรตอบได้",
      body:`
<div class="tblwrap"><table>
<tr><th>ชื่อการตลาด</th><th>มาตรฐาน</th><th>ย่าน</th><th>ความเร็วสูงสุด (ทฤษฎี)</th><th>จุดเด่น</th></tr>
<tr><td>—</td><td>802.11b</td><td>2.4 GHz</td><td>11 Mbps</td><td>รุ่นแรก ๆ</td></tr>
<tr><td>—</td><td>802.11a / g</td><td>5 / 2.4 GHz</td><td>54 Mbps</td><td>เริ่มใช้ OFDM</td></tr>
<tr><td>Wi-Fi 4</td><td>802.11n</td><td>2.4 + 5 GHz</td><td>ถึง 600 Mbps</td><td>MIMO, ช่องกว้าง 40 MHz</td></tr>
<tr><td>Wi-Fi 5</td><td>802.11ac</td><td>5 GHz</td><td>ระดับ Gbps</td><td>80/160 MHz, MU-MIMO ขาลง, 256-QAM</td></tr>
<tr><td>Wi-Fi 6</td><td>802.11ax</td><td>2.4 + 5 GHz</td><td>สูงกว่า ac หลายเท่า</td><td>OFDMA, MU-MIMO สองทาง, 1024-QAM, TWT, BSS Coloring</td></tr>
<tr><td>Wi-Fi 6E</td><td>802.11ax (6 GHz)</td><td>+ 6 GHz</td><td>เท่า Wi-Fi 6</td><td>ย่านใหม่ที่โล่ง ไม่มีอุปกรณ์เก่ามากวน</td></tr>
<tr><td>Wi-Fi 7</td><td>802.11be</td><td>2.4/5/6 GHz</td><td>สูงสุดในปัจจุบัน</td><td>320 MHz, 4096-QAM, MLO ใช้หลายย่านพร้อมกัน</td></tr>
</table></div>

<h3>ศัพท์เทคนิคที่ควรอธิบายได้สั้น ๆ</h3>
<ul>
<li><b>MIMO</b> — ใช้เสาอากาศหลายต้นรับส่งหลายสตรีมพร้อมกัน เพิ่มความเร็วรวม</li>
<li><b>MU-MIMO</b> — คุยกับอุปกรณ์หลายตัวได้พร้อมกัน แทนที่จะสลับทีละตัว</li>
<li><b>OFDMA</b> (จุดเด่นของ Wi-Fi 6) — ซอยช่องสัญญาณให้อุปกรณ์หลายตัวใช้ในเวลาเดียวกัน ทำให้พื้นที่ที่มีคนเยอะทำงานดีขึ้นชัดเจน</li>
<li><b>TWT</b> — นัดเวลาตื่นกับอุปกรณ์ ช่วยประหยัดแบตของ IoT/มือถือ</li>
<li><b>Backward compatible</b> — Wi-Fi 6 ใช้กับอุปกรณ์เก่าได้ แต่จะได้ความเร็วเท่าที่อุปกรณ์เก่ารองรับ</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"Wi-Fi 6 ดีกว่า Wi-Fi 5 อย่างไร" — จุดขายจริงไม่ใช่แค่เร็วขึ้น แต่คือรองรับอุปกรณ์จำนวนมากพร้อมกันได้ดีกว่า (OFDMA) และประหยัดพลังงาน (TWT)</li>
<li>"ลูกค้าซื้อเราเตอร์ Wi-Fi 6 แล้วทำไมยังได้เท่าเดิม" — เพราะมือถือ/โน้ตบุ๊กเป็น Wi-Fi 5 หรือแพ็กเกจเน็ตจำกัดความเร็วอยู่แล้ว</li>
</ul></div>`

    id:"s2c", title:"2.3 Wi-Fi Security",

    {
      id:"s2c1", t:"WPA2 / WPA3 / PSK",
      h:"มาตรฐานการเข้ารหัส Wi-Fi ตั้งแต่ WEP ถึง WPA3 และความต่างของ PSK กับ Enterprise",
      body:`
<h3>วิวัฒนาการของการเข้ารหัส</h3>
<div class="tblwrap"><table>
<tr><th>มาตรฐาน</th><th>การเข้ารหัส</th><th>สถานะ</th></tr>
<tr><td>WEP</td><td>RC4</td><td>ถูกเจาะได้ในไม่กี่นาที <b>ห้ามใช้</b></td></tr>
<tr><td>WPA</td><td>TKIP</td><td>เลิกใช้แล้ว ปลอดภัยไม่พอและทำให้ความเร็วตก</td></tr>
<tr><td>WPA2</td><td>AES / CCMP</td><td>มาตรฐานที่ใช้กันแพร่หลายที่สุด ยังถือว่าปลอดภัยหากตั้งรหัสดี</td></tr>
<tr><td>WPA3</td><td>SAE + AES-GCMP</td><td>ใหม่และปลอดภัยที่สุด</td></tr>
</table></div>

<h3>PSK คืออะไร</h3>
<p><b>PSK (Pre-Shared Key)</b> คือรหัสผ่านชุดเดียวที่แชร์ให้ทุกคนใช้ร่วมกัน เหมาะกับบ้านและออฟฟิศเล็ก ข้อเสียคือเมื่อพนักงานลาออกต้องเปลี่ยนรหัสและตั้งใหม่ทุกเครื่อง</p>

<h3>WPA2 vs WPA3</h3>
<ul>
<li>WPA2-PSK ใช้ <b>4-way handshake</b> ซึ่งผู้โจมตีสามารถดักจับไปเดารหัสแบบออฟไลน์ได้ (และเคยมีช่องโหว่ KRACK)</li>
<li>WPA3-Personal เปลี่ยนมาใช้ <b>SAE (Simultaneous Authentication of Equals)</b> ซึ่งกันการเดารหัสแบบออฟไลน์ และมี <b>Forward Secrecy</b> คือถึงรู้รหัสทีหลังก็ถอดข้อมูลที่ดักไว้ก่อนหน้าไม่ได้</li>
<li>WPA3 บังคับใช้ <b>PMF (802.11w)</b> ป้องกันการยิง deauth ให้หลุด Wi-Fi</li>
<li>มีโหมด <b>WPA2/WPA3 Transition</b> ให้อุปกรณ์เก่ายังต่อได้ระหว่างเปลี่ยนผ่าน</li>
</ul>

<h3>Personal vs Enterprise</h3>
<div class="tblwrap"><table>
<tr><th>หัวข้อ</th><th>Personal (PSK/SAE)</th><th>Enterprise (802.1X)</th></tr>
<tr><td>การยืนยันตัวตน</td><td>รหัสผ่านร่วมชุดเดียว</td><td>บัญชีรายบุคคลผ่าน RADIUS/AD</td></tr>
<tr><td>เมื่อพนักงานลาออก</td><td>ต้องเปลี่ยนรหัสทั้งระบบ</td><td>ปิดบัญชีคนนั้นคนเดียว</td></tr>
<tr><td>เหมาะกับ</td><td>บ้าน ร้านค้า ออฟฟิศเล็ก</td><td>องค์กร โรงเรียน โรงแรม</td></tr>
</table></div>

<h3>แนวปฏิบัติที่ควรแนะนำลูกค้า</h3>
<ul>
<li>ใช้ WPA2-AES เป็นอย่างน้อย เปิด WPA3 ถ้าอุปกรณ์รองรับ</li>
<li>รหัสผ่านยาวอย่างน้อย 12 ตัวอักษร ไม่ใช่เบอร์โทรหรือวันเกิด</li>
<li><b>ปิด WPS</b> เพราะ PIN 8 หลักถูกเดาได้</li>
<li>เปลี่ยนรหัสผ่านหน้าเว็บแอดมินของเราเตอร์ (ค่าเริ่มต้น admin/admin คือความเสี่ยงอันดับต้น ๆ)</li>
<li>เปิด Guest Network แยกวงให้แขก ไม่ให้เห็นอุปกรณ์ภายใน</li>
<li>รู้ว่าการ <b>ซ่อน SSID</b> และ <b>MAC Filter</b> ช่วยได้น้อยมาก เพราะปลอม MAC และดักชื่อได้ง่าย ถือเป็นการกันคนทั่วไปเท่านั้น</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"WPA2 กับ WPA3 ต่างกันตรงไหน" — ตอบที่ SAE, ป้องกันเดารหัสแบบออฟไลน์, Forward Secrecy และบังคับ PMF</li>
<li>"ถ้าลูกค้าสงสัยว่ามีคนแอบใช้ Wi-Fi จะทำอย่างไร" — ดูรายชื่ออุปกรณ์ที่เชื่อมต่อในหน้าเราเตอร์ เปลี่ยนรหัสเป็น WPA2/WPA3 ที่แข็งแรง ปิด WPS และเปลี่ยนรหัสแอดมิน</li>
</ul></div>`
    }]
  },

    items:[
    {
      id:"s2d1", t:"สาย UTP / RJ-45",
      h:"มาตรฐานการเข้าหัวสาย ประเภท Cat ข้อจำกัดระยะ 100 เมตร และการตรวจสายที่มีปัญหา",
      body:`
<h3>ลำดับสี T568B (ที่นิยมใช้ในไทย)</h3>
<ol>
<li>ขาว-ส้ม</li><li>ส้ม</li><li>ขาว-เขียว</li><li>น้ำเงิน</li>
<li>ขาว-น้ำเงิน</li><li>เขียว</li><li>ขาว-น้ำตาล</li><li>น้ำตาล</li>
</ol>
<p>ส่วน <b>T568A</b> สลับคู่ส้มกับเขียว หลักสำคัญคือ <b>สองหัวต้องเรียงเหมือนกัน</b> (Straight-through) ถ้าเข้าคนละมาตรฐานหัวละแบบจะกลายเป็นสาย Cross</p>

<h3>Straight vs Cross</h3>
<ul>
<li><b>Straight</b> — ต่ออุปกรณ์ต่างชนิด เช่น คอมพิวเตอร์ → สวิตช์</li>
<li><b>Cross</b> — ต่ออุปกรณ์ชนิดเดียวกัน เช่น คอม → คอม, สวิตช์ → สวิตช์</li>
<li>อุปกรณ์ยุคใหม่มี <b>Auto MDI-X</b> จึงใช้สายอะไรก็ได้ แต่ในสัมภาษณ์ควรตอบหลักการให้ถูก</li>
</ul>

<h3>ประเภทสายและความสามารถ</h3>
<div class="tblwrap"><table>
<tr><th>ประเภท</th><th>รองรับ</th><th>หมายเหตุ</th></tr>
<tr><td>Cat5e</td><td>1 Gbps ที่ 100 ม.</td><td>ใช้งานทั่วไป คุ้มค่าที่สุด</td></tr>
<tr><td>Cat6</td><td>1 Gbps ที่ 100 ม. / 10 Gbps ที่ ~55 ม.</td><td>มีแกนกลางกันสัญญาณไขว้</td></tr>
<tr><td>Cat6a</td><td>10 Gbps ที่ 100 ม.</td><td>หนากว่า ดัดยาก ราคาสูงกว่า</td></tr>
</table></div>
<p>สาย UTP มีข้อจำกัดระยะ <b>ไม่เกิน 100 เมตร</b> ต่อช่วง ถ้าต้องไกลกว่านั้นต้องมีสวิตช์คั่นหรือเปลี่ยนเป็นไฟเบอร์ นอกจากนี้ยังมี <b>PoE</b> (802.3af 15.4W / 802.3at 30W) ที่จ่ายไฟไปพร้อมข้อมูล ใช้กับกล้อง IP และ AP</p>

<h3>ปัญหาสายที่พบบ่อย</h3>
<ul>
<li>เข้าหัวไม่แน่น/ตัดสายไม่ตรง ทำให้ทองแดงไม่แตะเข็มครบทุกเส้น</li>
<li><b>Split pair</b> — เรียงสีผิดคู่ ผลคือใช้ได้ที่ 100 Mbps แต่ตกที่ 1 Gbps หรือมี packet loss</li>
<li>สายหักงอ/ถูกเก้าอี้ทับ/หนูกัด — อาการคือความเร็วตกหรือหลุดเป็นช่วง</li>
<li>เดินสายขนานกับสายไฟฟ้าแรงสูงหรือหลอดไฟ ทำให้เกิดสัญญาณรบกวน</li>
<li>ทดสอบด้วย <b>LAN Tester</b> ดูว่าไฟวิ่งครบ 1–8 เรียงตรงกันไหม และสังเกตความเร็วที่ลิงก์ขึ้น (ถ้าได้แค่ 100 Mbps ทั้งที่อุปกรณ์เป็น Gigabit มักเป็นที่สาย)</li>
</ul>`
    },
    {
      id:"s2d2", t:"ไฟสถานะอุปกรณ์ (Power, PON/LOS, LAN, Internet)",
      h:"อ่านไฟ LED บนโมเด็ม/ONU ให้ออก เพื่อบอกได้ทันทีว่าปัญหาอยู่ชั้นไหน",
      body:`
<p class="lead">การอ่านไฟ LED คือทักษะที่ใช้บ่อยที่สุดตอนรับสายลูกค้า เพราะลูกค้าดูให้เราได้โดยไม่ต้องเข้าหน้าเว็บ และบอกได้เกือบทันทีว่าปัญหาอยู่ที่สายภายนอก อุปกรณ์ หรือการยืนยันตัวตน</p>

<div class="tblwrap"><table>
<tr><th>ไฟ</th><th>สถานะปกติ</th><th>ผิดปกติ = อะไร</th><th>ทำอะไรต่อ</th></tr>
<tr><td><b>Power</b></td><td>ติดค้าง</td><td>ไม่ติด = ไม่มีไฟเลี้ยง</td><td>เช็คปลั๊ก อะแดปเตอร์ สวิตช์ ลองปลั๊กอื่น</td></tr>
<tr><td><b>PON</b></td><td>ติดค้างนิ่ง = sync กับชุมสายแล้ว</td><td>กะพริบต่อเนื่อง = กำลังพยายาม sync / ยังไม่ลงทะเบียน</td><td>ถ้ากะพริบนานเกิน 2–3 นาที ให้ตรวจสายไฟเบอร์และแจ้งระบบตรวจสถานะพอร์ต</td></tr>
<tr><td><b>LOS</b></td><td>ดับสนิท</td><td>แดง/กะพริบแดง = ไม่มีสัญญาณแสง (Loss of Signal)</td><td>ตรวจหัวไฟเบอร์หลุด/หัก/สกปรก เช็ดแล้วเสียบใหม่ ถ้ายังแดง = สายภายนอกขาด ต้องส่งช่าง</td></tr>
<tr><td><b>LAN / ETH</b></td><td>ติดหรือกะพริบตามการรับส่งข้อมูล</td><td>ดับ = ไม่มีอุปกรณ์ต่ออยู่ หรือสาย/พอร์ตเสีย</td><td>สลับพอร์ต สลับสาย ทดสอบกับเครื่องอื่น</td></tr>
<tr><td><b>Internet / WAN</b></td><td>เขียว = ออกเน็ตได้</td><td>แดง/ส้ม = ต่อเน็ตไม่สำเร็จ ทั้งที่ชั้นกายภาพปกติ</td><td>ตรวจ PPPoE username/password, สถานะค้างชำระ, โปรไฟล์บริการ</td></tr>
<tr><td><b>WLAN / Wi-Fi</b></td><td>ติด/กะพริบ</td><td>ดับ = Wi-Fi ถูกปิด (ปุ่มหรือในหน้าตั้งค่า)</td><td>กดปุ่ม WLAN หรือเปิดจากหน้าเว็บเราเตอร์</td></tr>
</table></div>

<h3>อ่านไฟแล้วสรุปให้เป็น</h3>
<ul>
<li>Power ติด + <b>LOS แดง</b> → ปัญหาสายไฟเบอร์/ภายนอก แก้ที่ปลายทางไม่ได้ ต้องส่งช่าง</li>
<li>PON ติดนิ่ง + <b>Internet แดง</b> → ชั้นกายภาพดี แต่ authenticate ไม่ผ่าน → ไปที่ PPPoE/บัญชี</li>
<li>ทุกไฟปกติ แต่ลูกค้าใช้ไม่ได้ → ปัญหาอยู่ฝั่ง LAN/เครื่องลูกค้า → ไปไล่ IP, DNS, Wi-Fi, ตัวเครื่อง</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"ลูกค้าโทรมาบอกเน็ตใช้ไม่ได้ คุณจะถามอะไรก่อน" — คำตอบที่ได้คะแนนคือ "ขอให้ลูกค้าดูไฟที่กล่องให้หน่อยครับ ไฟ LOS แดงไหม" เพราะตัดสาเหตุได้เร็วที่สุดโดยลูกค้าทำเองได้</li>
<li>ระวังตอบว่า "ให้รีสตาร์ตก่อนเสมอ" — ควรอ่านไฟก่อน เพราะถ้า LOS แดง รีสตาร์ตกี่รอบก็ไม่หาย</li>
</ul></div>`

    {
      id:"s3a1", t:"Network Adapter Settings (Static / Dynamic IP)",
      h:"เข้าไปตั้งค่าการ์ดแลนบน Windows และ Mac ตั้ง IP อัตโนมัติหรือแบบคงที่ให้ถูกต้อง",
      body:`
<h3>Windows</h3>
<ul>
<li>ทางลัดที่เร็วที่สุด: กด <b>Win + R</b> แล้วพิมพ์ <code>ncpa.cpl</code> → คลิกขวาที่การ์ด → Properties → เลือก <b>Internet Protocol Version 4 (TCP/IPv4)</b> → Properties</li>
<li>หรือไปที่ Settings → Network &amp; Internet → เลือกการเชื่อมต่อ → IP assignment → Edit</li>
<li>ปิด/เปิดการ์ด (Disable/Enable) เป็นวิธีรีเซ็ตเร็ว ๆ เมื่อการ์ดค้าง</li>
</ul>

<h3>macOS</h3>
<ul>
<li>System Settings → Network → เลือก Wi-Fi หรือ Ethernet → <b>Details</b> → แท็บ TCP/IP</li>
<li>Configure IPv4: <b>Using DHCP</b> (อัตโนมัติ) หรือ <b>Manually</b> (คงที่) ส่วน DNS อยู่แท็บถัดไป</li>
<li>ปุ่ม <b>Renew DHCP Lease</b> ใช้ขอ IP ใหม่ เทียบเท่ากับ <code>ipconfig /renew</code> บน Windows</li>
</ul>

<h3>Dynamic vs Static</h3>
<div class="tblwrap"><table>
<tr><th>หัวข้อ</th><th>Dynamic (DHCP)</th><th>Static</th></tr>
<tr><td>ที่มาของ IP</td><td>เซิร์ฟเวอร์แจกให้</td><td>กรอกเองที่เครื่อง</td></tr>
<tr><td>ข้อดี</td><td>ตั้งครั้งเดียวจบ ไม่ชนกัน ย้ายที่ได้</td><td>IP ไม่เปลี่ยน อ้างอิงได้แน่นอน</td></tr>
<tr><td>ข้อเสีย</td><td>IP อาจเปลี่ยนตามรอบ lease</td><td>เสี่ยง IP ชนกัน ถ้าไม่จดบันทึกจะจัดการยาก</td></tr>
<tr><td>เหมาะกับ</td><td>เครื่องผู้ใช้ทั่วไป มือถือ โน้ตบุ๊ก</td><td>ปรินเตอร์ เซิร์ฟเวอร์ กล้อง สวิตช์ อุปกรณ์เครือข่าย</td></tr>
</table></div>

<h3>4 ค่าที่ต้องกรอกให้ครบเมื่อตั้ง Static</h3>
<ol>
<li><b>IP Address</b> — ต้องอยู่วงเดียวกับ Gateway และไม่ซ้ำกับใคร (ควรอยู่นอกช่วงที่ DHCP แจก)</li>
<li><b>Subnet Mask</b> — ปกติ 255.255.255.0</li>
<li><b>Default Gateway</b> — IP ของเราเตอร์ ถ้าไม่ใส่จะออกอินเทอร์เน็ตไม่ได้ (แต่ยังคุยในวงได้)</li>
<li><b>DNS Server</b> — ถ้าไม่ใส่จะเปิดเว็บด้วยชื่อไม่ได้ แม้ ping IP จะผ่าน</li>
</ol>

<div class="tip"><b>💡 เคล็ดที่ทำให้ดูมืออาชีพ</b>
<p>ถ้าต้องการให้อุปกรณ์มี IP คงที่ ให้แนะนำใช้ <b>DHCP Reservation</b> บนเราเตอร์แทนการตั้ง Static ที่เครื่อง เพราะจัดการรวมศูนย์ ตรวจสอบง่าย และไม่เกิด IP ชนกันเมื่อคนอื่นมาตั้งทับ</p></div>`
    },
    {
      id:"s3a2", t:"คำสั่ง CMD / Terminal",
      h:"ชุดคำสั่งที่ต้องใช้จริงทุกวัน พร้อมความหมายของผลลัพธ์ที่ได้",
      body:`
<h3>คำสั่งหลักบน Windows</h3>
<div class="tblwrap"><table>
<tr><th>คำสั่ง</th><th>ใช้ทำอะไร</th></tr>
<tr><td><code>ipconfig</code></td><td>ดู IP, Subnet, Gateway แบบย่อ</td></tr>
<tr><td><code>ipconfig /all</code></td><td>ดูละเอียด: MAC Address, DHCP Server, DNS, สถานะ DHCP เปิด/ปิด</td></tr>
<tr><td><code>ipconfig /release</code> + <code>/renew</code></td><td>คืน IP เดิมแล้วขอใหม่จาก DHCP</td></tr>
<tr><td><code>ipconfig /flushdns</code></td><td>ล้าง DNS cache ในเครื่อง แก้เคสเว็บย้าย IP แล้วยังชี้ที่เดิม</td></tr>
<tr><td><code>ping x.x.x.x</code></td><td>ทดสอบว่าติดต่อปลายทางได้ไหม (<code>-t</code> ping ต่อเนื่อง, <code>-n 10</code> กำหนดจำนวน)</td></tr>
<tr><td><code>tracert</code></td><td>ดูเส้นทางว่าผ่าน hop ใดบ้าง และไปตกที่ hop ไหน</td></tr>
<tr><td><code>nslookup ชื่อเว็บ</code></td><td>ทดสอบการแปลงชื่อเป็น IP ระบุเซิร์ฟเวอร์เองได้ เช่น <code>nslookup google.com 8.8.8.8</code></td></tr>
<tr><td><code>netstat -ano</code></td><td>ดูการเชื่อมต่อและพอร์ตที่เปิด พร้อม PID ของโปรเซส</td></tr>
<tr><td><code>arp -a</code></td><td>ดูตารางจับคู่ IP กับ MAC ในวง ใช้ตามหา IP ชนกัน</td></tr>
<tr><td><code>route print</code></td><td>ดูตารางเส้นทาง ตรวจว่า default route ถูกต้องไหม</td></tr>
<tr><td><code>getmac</code></td><td>ดู MAC Address ของเครื่อง</td></tr>
<tr><td><code>Test-NetConnection host -Port 443</code></td><td>(PowerShell) ทดสอบว่าพอร์ตปลายทางเปิดไหม แทน telnet</td></tr>
</table></div>

<h3>คำสั่งเทียบเคียงบน macOS / Linux</h3>
<div class="tblwrap"><table>
<tr><th>Windows</th><th>macOS / Linux</th></tr>
<tr><td>ipconfig /all</td><td><code>ifconfig</code> หรือ <code>ip addr</code></td></tr>
<tr><td>ping (วิ่งไม่หยุด ต้อง Ctrl+C)</td><td><code>ping -c 4 8.8.8.8</code> (ระบุจำนวนครั้ง)</td></tr>
<tr><td>tracert</td><td><code>traceroute</code></td></tr>
<tr><td>nslookup</td><td><code>dig</code> หรือ <code>nslookup</code></td></tr>
<tr><td>ipconfig /flushdns</td><td><code>sudo dscacheutil -flushcache</code> ตามด้วย <code>sudo killall -HUP mDNSResponder</code></td></tr>
<tr><td>route print</td><td><code>netstat -rn</code></td></tr>
</table></div>

<h3>อ่านผลลัพธ์ให้เป็น</h3>
<ul>
<li><b>Request timed out</b> — ส่งออกไปแล้วแต่ไม่มีคำตอบกลับ อาจถูกไฟร์วอลล์บล็อกหรือปลายทางดับ</li>
<li><b>Destination host unreachable</b> — เราเตอร์บอกว่าไม่รู้จะส่งไปทางไหน มักเป็นปัญหา route หรือ gateway</li>
<li><b>ping IP ได้ แต่ ping ชื่อไม่ได้</b> — ปัญหา DNS ชัดเจน</li>
<li>ค่า <b>time</b> สูงผิดปกติหรือแกว่ง = ความหน่วงสูง/สายมีปัญหา ส่วน TTL ใช้เดาระบบปฏิบัติการปลายทางได้คร่าว ๆ</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"จะดู IP เครื่องตัวเองยังไง" และ "flushdns ใช้ตอนไหน"</li>
<li>"ping กับ tracert ต่างกันอย่างไร" — ping บอกแค่ถึง/ไม่ถึง ส่วน tracert บอกว่าไปตายที่จุดไหนของเส้นทาง ซึ่งช่วยชี้ว่าเป็นปัญหาในองค์กรหรือฝั่ง ISP</li>
</ul></div>`
    }]
  },

    items:[
    {
      id:"s3b1", t:"MS Office / Outlook (POP3 vs IMAP vs Exchange, .pst/.ost)",
      h:"ความต่างของโปรโตคอลอีเมล พอร์ตที่ใช้ ไฟล์ข้อมูล และปัญหา Outlook ที่เจอบ่อย",
      body:`
<h3>POP3 vs IMAP vs Exchange</h3>
<div class="tblwrap"><table>
<tr><th>หัวข้อ</th><th>POP3</th><th>IMAP</th><th>Exchange</th></tr>
<tr><td>เก็บเมลไว้ที่</td><td>ดาวน์โหลดลงเครื่อง (มักลบจากเซิร์ฟเวอร์)</td><td>เก็บบนเซิร์ฟเวอร์</td><td>เก็บบนเซิร์ฟเวอร์</td></tr>
<tr><td>ใช้หลายอุปกรณ์</td><td>ไม่เหมาะ สถานะไม่ตรงกัน</td><td>ได้ sync โฟลเดอร์/สถานะอ่าน</td><td>ได้ครบที่สุด</td></tr>
<tr><td>sync ปฏิทิน/รายชื่อ</td><td>ไม่ได้</td><td>ไม่ได้</td><td>ได้ (ปฏิทิน, Contact, Task)</td></tr>
<tr><td>พอร์ต</td><td>110 / <b>995 (SSL)</b></td><td>143 / <b>993 (SSL)</b></td><td>ผ่าน HTTPS 443 (MAPI/Autodiscover)</td></tr>
</table></div>
<p>การส่งออกใช้ <b>SMTP</b> พอร์ต 25 (มักถูก ISP บล็อก), <b>587</b> (STARTTLS — แนะนำ) หรือ <b>465</b> (SSL)</p>

<h3>ไฟล์ข้อมูล .pst vs .ost</h3>
<ul>
<li><b>.pst</b> — Personal Storage Table ใช้เก็บเมลแบบออฟไลน์กับบัญชี POP หรือใช้เก็บ Archive ผู้ใช้เป็นเจ้าของไฟล์เอง ถ้าไฟล์หายคือเมลหาย จึงต้องเตือนเรื่องสำรองข้อมูล</li>
<li><b>.ost</b> — Offline Storage Table เป็นสำเนา (cache) ของกล่องเมลบนเซิร์ฟเวอร์สำหรับ Exchange/IMAP ทำให้เปิดเมลตอนออฟไลน์ได้ ถ้าไฟล์เสียสามารถลบทิ้งแล้วให้ Outlook sync ใหม่ได้ เพราะต้นฉบับอยู่บนเซิร์ฟเวอร์</li>
<li>ซ่อมไฟล์เสียด้วยเครื่องมือ <b>ScanPST.exe</b> ซึ่งอยู่ในโฟลเดอร์ติดตั้งของ Office</li>
</ul>

<h3>ปัญหา Outlook ที่เจอบ่อยและวิธีไล่</h3>
<ul>
<li><b>รับ/ส่งเมลไม่ได้</b> → ตรวจอินเทอร์เน็ตก่อน แล้วดูพอร์ต/SSL ในการตั้งค่าบัญชี และทดสอบผ่าน <b>เว็บเมล (OWA)</b> เพื่อแยกว่าเป็นที่ตัวโปรแกรมหรือที่บัญชี</li>
<li><b>รหัสผ่านเด้งถามซ้ำ ๆ</b> → รหัสหมดอายุ, เปิด MFA แล้วต้องใช้ App Password, หรือ credential เก่าค้างใน Credential Manager</li>
<li><b>Outlook ค้าง/เปิดช้า</b> → ไฟล์ .ost ใหญ่เกินไป, Add-in มีปัญหา (ลองเปิด Safe Mode ด้วย <code>outlook /safe</code>), สร้างโปรไฟล์ใหม่จาก Control Panel → Mail</li>
<li><b>ส่งไม่ออกแต่รับได้</b> → มักเป็นพอร์ต SMTP ถูกบล็อกหรือกล่องเต็ม</li>
<li><b>เมลหายหลังตั้งค่าใหม่</b> → คลาสสิกของ POP3 ที่ตั้ง "ลบจากเซิร์ฟเวอร์" ควรแนะนำ IMAP แทน</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"POP กับ IMAP ต่างกันอย่างไร ควรแนะนำอันไหน" — ตอบ IMAP สำหรับคนใช้หลายอุปกรณ์ เพราะ sync กับเซิร์ฟเวอร์</li>
<li>"ผู้ใช้บอกส่งเมลไม่ออก คุณจะเช็คอะไรบ้าง" — ไล่จากเน็ต → ทดสอบผ่านเว็บเมล → พอร์ต/SSL → พื้นที่กล่องเมล → ขนาดไฟล์แนบ → ข้อความ error ที่ได้จริง</li>
</ul></div>`
    },
    {
      id:"s3b2", t:"Browsers (Cache/Cookies, Proxy, Incognito)",
      h:"ปัญหาระดับเบราว์เซอร์ที่มักถูกเข้าใจผิดว่าเป็นปัญหาเน็ต และวิธีแยกให้ชัด",
      body:`
<h3>Cache และ Cookies</h3>
<ul>
<li><b>Cache</b> เก็บไฟล์หน้าเว็บไว้เพื่อโหลดเร็วขึ้น ถ้าค้างเวอร์ชันเก่าจะทำให้หน้าเว็บเพี้ยน ปุ่มกดไม่ได้ หรือแสดงข้อมูลเก่า</li>
<li><b>Cookies</b> เก็บสถานะการล็อกอิน ถ้าเสียหายจะ login ไม่ผ่าน หรือเด้งออกตลอด</li>
<li>ทางแก้: <b>Ctrl + Shift + Delete</b> เพื่อล้าง หรือ <b>Ctrl + F5</b> เพื่อ hard refresh เฉพาะหน้านั้น</li>
</ul>

<h3>Proxy</h3>
<ul>
<li>ถ้าตั้ง Proxy ผิดหรือ Proxy ล่ม จะเกิดอาการ "ping ออกได้ แต่เปิดเว็บไม่ได้" ซึ่งหลอกให้เข้าใจผิดว่าเน็ตเสีย</li>
<li>ตรวจบน Windows: Settings → Network &amp; Internet → Proxy หรือ Run <code>inetcpl.cpl</code> → Connections → LAN Settings</li>
<li>ในองค์กรอาจตั้งอัตโนมัติผ่าน <b>PAC file / WPAD</b> หรือถูกบังคับด้วย Group Policy</li>
<li>มัลแวร์บางตัวชอบตั้ง Proxy แอบไว้ ถ้าเจอค่าแปลก ๆ ที่ผู้ใช้ไม่ได้ตั้ง ควรสแกนไวรัสด้วย</li>
</ul>

<h3>Incognito / Private Mode</h3>
<ul>
<li>ไม่ใช้ cache, cookie และไม่โหลดส่วนขยาย (ตามค่าเริ่มต้น) จึงเป็น <b>เครื่องมือแยกปัญหาที่เร็วที่สุด</b></li>
<li>ถ้าเปิด Incognito แล้วใช้ได้ปกติ = ปัญหาอยู่ที่ข้อมูลค้างหรือส่วนขยายในโปรไฟล์ผู้ใช้ ไม่ใช่ที่เครือข่าย</li>
<li>ข้อควรรู้: Incognito ไม่ได้ทำให้ "ไม่ถูกมองเห็น" — ผู้ดูแลระบบและ ISP ยังเห็นการใช้งานได้</li>
</ul>

<h3>เช็คลิสต์ปัญหาเบราว์เซอร์</h3>
<ol>
<li>เปิดเว็บอื่นได้ไหม (เว็บเดียวเสีย หรือทุกเว็บเสีย)</li>
<li>เครื่องอื่นในวงเดียวกันเปิดเว็บนั้นได้ไหม</li>
<li>ลองเบราว์เซอร์ตัวอื่น และลอง Incognito</li>
<li>ล้าง cache/cookies แล้วลองใหม่</li>
<li>ปิดส่วนขยาย โดยเฉพาะ Ad-blocker และ VPN extension</li>
<li>ตรวจ Proxy และ DNS ของเครื่อง</li>
<li>ถ้าขึ้น <b>certificate error</b> ให้ตรวจวันที่-เวลาของเครื่องว่าตรงไหม (เวลาผิดทำให้ HTTPS พังทุกเว็บ)</li>
</ol>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<ul>
<li>"ผู้ใช้บอกเปิดเว็บบริษัทไม่ได้ แต่เว็บอื่นได้ จะทำอย่างไร" — ยืนยันขอบเขตกับเครื่องอื่นก่อน แล้วทดสอบ ping/nslookup ชื่อเว็บนั้น ตรวจ Proxy/Firewall และดูว่าเว็บนั้นล่มเองหรือไม่</li>
</ul></div>`
    }]
  }]

  id:"s4", title:"4. ทักษะการแก้ปัญหาเบื้องต้น",

  {
    id:"s4a", title:'4.1 Scenario: "อินเทอร์เน็ตใช้ไม่ได้" ตรวจอะไรก่อน-หลัง',
    items:[
    {
      id:"s4a0", t:"ขั้นที่ 0 – สอบถามและระบุขอบเขตปัญหา",
      h:"คำถามไม่กี่ข้อที่ตัดสาเหตุออกไปได้ครึ่งหนึ่ง ก่อนจะลงมือแก้อะไรทั้งสิ้น",
      body:`
<p class="lead">มือใหม่มักรีบลงมือแก้ทันที ส่วนคนที่ทำงานเป็นจะถามให้ครบก่อน เพราะคำถาม 4–5 ข้อช่วยตัดสาเหตุออกไปได้มหาศาล และเป็นสิ่งที่ผู้สัมภาษณ์ต้องการเห็น</p>

<h3>คำถามที่ต้องถาม</h3>
<ul>
<li><b>ขอบเขต</b> — เป็นเครื่องเดียว หรือทุกเครื่องในบ้าน/ออฟฟิศ? (ถ้าทุกเครื่อง → มองที่เราเตอร์/ISP, ถ้าเครื่องเดียว → มองที่เครื่องนั้น)</li>
<li><b>ช่องทาง</b> — ต่อสาย LAN หรือ Wi-Fi? (Wi-Fi เสียแต่สายใช้ได้ → ปัญหาอยู่ที่ภาคไร้สาย)</li>
<li><b>อาการที่แท้จริง</b> — เข้าไม่ได้ทุกเว็บ หรือบางเว็บ/บางแอป? ขึ้นข้อความ error ว่าอะไร?</li>
<li><b>เวลา</b> — เริ่มเมื่อไร เป็นตลอดหรือเป็นช่วง? มีช่วงเวลาที่ซ้ำเดิมไหม (ชี้ไปที่ปัญหาโหลดหรือสัญญาณรบกวน)</li>
<li><b>สิ่งที่เปลี่ยนไป</b> — เพิ่งย้ายโต๊ะ เปลี่ยนอุปกรณ์ อัปเดตระบบ ติดตั้งโปรแกรมใหม่ ไฟดับ หรือฝนตกหนักหรือไม่</li>
<li><b>ทำอะไรไปแล้วบ้าง</b> — เพื่อไม่ให้ทำซ้ำและรู้ว่าลูกค้าแก้อะไรไปจนอาจทำให้อาการเปลี่ยน</li>
</ul>

<h3>หลักการที่ใช้ได้เสมอ</h3>
<ul>
<li><b>แยกให้แคบลงเรื่อย ๆ (Divide and conquer)</b> — เปลี่ยนทีละอย่างแล้วทดสอบ ไม่ใช่เปลี่ยนพร้อมกันหมด เพราะจะไม่รู้ว่าอะไรคือสาเหตุจริง</li>
<li><b>เทียบกับตัวที่ใช้ได้</b> — มีเครื่อง/สาย/พอร์ตที่ปกติอยู่ ให้ใช้เป็นตัวเปรียบเทียบ</li>
<li><b>สื่อสารกับผู้ใช้ตลอด</b> — บอกว่ากำลังทำอะไร ใช้เวลาประมาณเท่าไร ไม่ทิ้งให้เงียบ</li>
</ul>

<div class="tip"><b>💡 มักถูกถามในสัมภาษณ์</b>
<p>คำถาม "เน็ตใช้ไม่ได้ ทำยังไง" ไม่ได้วัดว่าคุณรู้คำสั่งอะไร แต่วัดว่าคุณ <b>มีลำดับความคิดเป็นระบบหรือไม่</b> ให้ตอบเป็นขั้นเสมอ: สอบถามขอบเขต → Physical → IP → Connectivity → DNS → Application → ยืนยันผลและบันทึก</p></div>`
    },

      body:`
<h3>สิ่งที่ต้องตรวจ</h3>
<ul>
<li><b>ไฟสถานะที่โมเด็ม/ONU</b> — Power, PON, LOS, Internet, LAN (ถ้า LOS แดง จบทันที ต้องส่งช่าง)</li>
<li><b>สาย LAN</b> — เสียบแน่นไหม หัวล็อกหักหรือไม่ ไฟที่พอร์ตติดไหม ลองสลับพอร์ตหรือเปลี่ยนสายเส้นที่รู้ว่าดี</li>
<li><b>Wi-Fi</b> — เชื่อมต่ออยู่กับ SSID ที่ถูกต้องหรือไม่ (บางทีไปเกาะ Wi-Fi เพื่อนบ้านหรือ SSID ตัวขยายสัญญาณ) ความแรงสัญญาณกี่ขีด ปุ่ม Airplane mode / สวิตช์ Wi-Fi บนโน้ตบุ๊กเปิดอยู่ไหม</li>
<li><b>ไฟเลี้ยง</b> — อะแดปเตอร์ ปลั๊กพ่วง หลังไฟดับอุปกรณ์บางตัวไม่กลับมาเอง</li>
<li><b>ความร้อน</b> — อุปกรณ์ที่ร้อนจัดจะหลุดเป็นช่วง ๆ</li>
</ul>

<h3>Power cycle ที่ถูกวิธี</h3>
<p>ถอดปลั๊กโมเด็ม/ONU และเราเตอร์ รอ <b>ประมาณ 30 วินาที</b> แล้วเปิด <b>ตัวที่ติดกับ ISP ก่อน</b> รอจนไฟ PON/Internet นิ่ง จึงค่อยเปิดเราเตอร์ตัวถัดไป ถ้าเปิดพร้อมกันหรือสลับลำดับ เราเตอร์อาจขอ IP ตอนที่ต้นทางยังไม่พร้อม</p>

<div class="warn-box"><b>⚠️ ข้อควรระวัง</b>
<p>อย่ากดปุ่ม <b>Reset</b> (รูจิ้ม) โดยไม่จำเป็น เพราะจะล้างค่าทั้งหมดรวมถึง PPPoE, VLAN, ชื่อ/รหัส Wi-Fi ทำให้ลูกค้าใช้งานไม่ได้ยาวกว่าเดิม ให้ใช้การ Restart (ถอดปลั๊ก) เท่านั้น เว้นแต่มีค่าตั้งครบและตั้งใจจะตั้งใหม่</p></div>`

      id:"s4a2", t:"ขั้นที่ 2 – IP Configuration",
      h:"ตรวจว่าเครื่องได้ IP ที่ถูกต้องหรือไม่ ก่อนจะไปทดสอบการเชื่อมต่อ",
      body:`
<h3>ขั้นตอน</h3>
<ol>
<li>รัน <code>ipconfig /all</code> (Mac: <code>ifconfig</code> หรือดูที่ System Settings → Network)</li>
<li>ตรวจ 4 ค่า: <b>IP Address</b>, <b>Subnet Mask</b>, <b>Default Gateway</b>, <b>DNS Server</b></li>
<li>ดูว่า IP อยู่วงเดียวกับ Gateway หรือไม่ และเป็นวงที่ควรจะเป็นหรือไม่</li>
</ol>

<h3>แปลผลที่ได้</h3>
<div class="tblwrap"><table>
<tr><th>สิ่งที่เห็น</th><th>แปลว่า</th><th>ทำอะไรต่อ</th></tr>
<tr><td>169.254.x.x</td><td>ขอ IP จาก DHCP ไม่ได้</td><td>เช็คสาย/พอร์ต/VLAN → <code>ipconfig /release</code> แล้ว <code>/renew</code> → ตรวจ DHCP บนเราเตอร์ว่าเปิดอยู่และ IP ในพูลยังเหลือ</td></tr>
<tr><td>ไม่มี IP เลย / Media disconnected</td><td>ชั้นกายภาพยังไม่เชื่อมต่อ</td><td>กลับไปขั้นที่ 1 ตรวจสายและการ์ดแลนว่าถูก Disable ไว้ไหม</td></tr>
<tr><td>IP คนละวงกับ Gateway</td><td>มีคนตั้ง Static ค้างไว้ หรือได้ IP จาก DHCP ตัวอื่น</td><td>เปลี่ยนกลับเป็น Obtain automatically หรือแก้ค่าให้ถูกวง</td></tr>
<tr><td>ไม่มี Default Gateway</td><td>ออกนอกวงไม่ได้</td><td>ตั้งค่าใหม่ให้ถูกต้อง หรือขอ IP ใหม่</td></tr>
<tr><td>DNS ว่างหรือเป็นค่าแปลก ๆ</td><td>เปิดเว็บด้วยชื่อไม่ได้</td><td>ตั้ง DNS เป็นของเราเตอร์ หรือ 8.8.8.8 / 1.1.1.1</td></tr>
<tr><td>ได้ IP ถูกต้องครบ</td><td>ชั้น 1–3 ฝั่งเราปกติ</td><td>ไปขั้นที่ 3 ทดสอบการเชื่อมต่อ</td></tr>
</table></div>

<div class="tip"><b>💡 เกร็ด</b>
<p>ถ้าสงสัยว่า DHCP มีปัญหา ให้ลองตั้ง Static IP ในวงเดียวกันชั่วคราว ถ้าใช้งานได้ทันที แสดงว่าปัญหาอยู่ที่กระบวนการแจก IP ไม่ใช่ที่สายหรือสวิตช์ — อย่าลืมเปลี่ยนกลับเป็น DHCP เมื่อแก้ต้นเหตุเสร็จ</p></div>`
    },
    {
      id:"s4a3", t:"ขั้นที่ 3 – Connectivity (บันได ping)",
      h:"ทดสอบเป็นชั้น ๆ จากในเครื่องออกไปข้างนอก เพื่อชี้จุดที่ขาดให้แม่นยำ",
      body:`
<p class="lead">เทคนิคที่ใช้ได้ผลที่สุดคือ ping ไล่จากใกล้ตัวออกไปไกล ทีละขั้น แล้วดูว่าขาดที่ขั้นไหน จุดที่ขาดจะบอกขอบเขตของปัญหาเอง</p>

<h3>บันได 4 ขั้น</h3>
<div class="tblwrap"><table>
<tr><th>ลำดับ</th><th>คำสั่ง</th><th>ทดสอบอะไร</th><th>ถ้าไม่ผ่าน แปลว่า</th></tr>
<tr><td>1</td><td><code>ping 127.0.0.1</code></td><td>TCP/IP stack ในเครื่อง</td><td>ระบบเครือข่ายในเครื่องมีปัญหา (ไดรเวอร์/สแตกเสีย) ลอง reset winsock</td></tr>
<tr><td>2</td><td><code>ping IP ตัวเอง</code></td><td>การ์ดแลนของเครื่อง</td><td>การ์ดแลนหรือการตั้งค่า IP ผิดปกติ</td></tr>
<tr><td>3</td><td><code>ping Gateway</code></td><td>การเชื่อมต่อภายในวง LAN</td><td>ปัญหาสาย/สวิตช์/Wi-Fi/VLAN ระหว่างเครื่องกับเราเตอร์</td></tr>
<tr><td>4</td><td><code>ping 8.8.8.8</code></td><td>ออกอินเทอร์เน็ตได้จริงไหม</td><td>ปัญหาอยู่ฝั่ง WAN → ตรวจ PPPoE, ไฟ Internet, สถานะ ISP</td></tr>
</table></div>

<h3>ตีความผลลัพธ์</h3>
<ul>
<li><b>ping Gateway ได้ แต่ 8.8.8.8 ไม่ได้</b> = LAN ปกติ ปัญหาอยู่ที่เราเตอร์ออกไปข้างนอก ให้ดูสถานะ WAN/PPPoE บนหน้าเราเตอร์ และใช้ <code>tracert 8.8.8.8</code> ดูว่าไปตกที่ hop ไหน (ถ้าตกตั้งแต่ hop แรก ๆ = ภายใน, ถ้าตกกลางทาง = ฝั่ง ISP)</li>
<li><b>ping ได้แต่มี packet loss / time สูงและแกว่ง</b> = เชื่อมต่อได้แต่คุณภาพแย่ มักเป็นสายชำรุด สัญญาณ Wi-Fi อ่อน หรือแบนด์วิดท์เต็ม ให้ ping ต่อเนื่องด้วย <code>ping -t</code> เพื่อดูความสม่ำเสมอ</li>
<li><b>ping ไม่ได้แต่เปิดเว็บได้</b> = ปลายทางบล็อก ICMP ไว้ ไม่ได้แปลว่าเน็ตเสีย — อย่าด่วนสรุปจาก ping อย่างเดียว</li>
</ul>`
    },
    {
      id:"s4a4", t:"ขั้นที่ 4 – DNS",

/* =========================================================
   STATE
   ========================================================= */
const KEY = "it-support-checklist-v1";
const OPENKEY = "it-support-checklist-open-v1";
const NOTEKEY = "it-support-notes-v1";
const THEMEKEY = "it-support-theme";

let state = {}, openState = {}, notes = {}, theme = "dark";
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ state = {}; }
try { openState = JSON.parse(localStorage.getItem(OPENKEY)) || {}; } catch(e){ openState = {}; }
try { notes = JSON.parse(localStorage.getItem(NOTEKEY)) || {}; } catch(e){ notes = {}; }
try { theme = localStorage.getItem(THEMEKEY) || "dark"; } catch(e){}

const FLAT = [];  // รายการ item ทั้งหมดเรียงลำดับ ใช้ทำปุ่มก่อนหน้า/ถัดไป
DATA.forEach(sec => sec.subs.forEach(sub => sub.items.forEach(it =>
  FLAT.push({ item: it, sub, sec })
)));

const $ = id => document.getElementById(id);
const homeEl = $("home"), detailEl = $("detail");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const chevSVG = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

/* =========================================================
   THEME
   ========================================================= */
const THEME_LABEL = { dark:"🌙 มืด", light:"☀️ สว่าง", auto:"🌗 ตามระบบ" };
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  const label = THEME_LABEL[theme] || THEME_LABEL.dark;
  $("btnTheme").textContent = label;
  $("btnTheme2").textContent = label;
  try { localStorage.setItem(THEMEKEY, theme); } catch(e){}
}
function cycleTheme(){
  theme = theme === "dark" ? "light" : theme === "light" ? "auto" : "dark";
  applyTheme();
}
$("btnTheme").addEventListener("click", cycleTheme);
$("btnTheme2").addEventListener("click", cycleTheme);

/* =========================================================
   HOME VIEW
   ========================================================= */
function renderHome(){
  homeEl.innerHTML = DATA.map(sec => `
    <section class="sec" id="${sec.id}">
      <div class="sec-head" data-toggle="${sec.id}">
        <input type="checkbox" data-role="sec" data-id="${sec.id}" aria-label="ติ๊กทั้งหัวข้อ">
        <div class="sec-title">
          <b>${esc(sec.title)}</b>
          <div class="sec-meta">
            <div class="bar" data-bar="${sec.id}"><i></i></div>
            <span class="count" data-count="${sec.id}"></span>
          </div>
        </div>
        ${chevSVG}
      </div>
      <div class="sec-body">
        ${sec.subs.map(sub => `
          <div class="sub-block" data-sub="${sub.id}">
            <div class="row">
              <input type="checkbox" data-role="sub" data-id="${sub.id}" id="cb-${sub.id}">
              <label for="cb-${sub.id}">${esc(sub.title)}</label>
            </div>
            <div class="items">
              ${sub.items.map(it => `
                <div class="item" data-item="${it.id}">
                  <div class="row">
                    <input type="checkbox" data-role="item" data-id="${it.id}" aria-label="ทบทวนแล้ว">
                    <button class="open-link" data-open="${it.id}">
                      <span>${esc(it.t)}</span>
                      <span class="badge" data-badge="${it.id}" title="มีสรุปของคุณแล้ว" hidden>📝</span>
                      <span class="arrow">›</span>
                    </button>
                  </div>
                  <div class="preview">${esc(it.h)}</div>
                </div>
              `).join("")}
            </div>
          </div>
        `).join("")}
      </div>
    </section>
  `).join("");

  const hasSaved = Object.keys(openState).length > 0;
  DATA.forEach((sec, i) => {
    const open = hasSaved ? !!openState[sec.id] : i === 0;
    $(sec.id).classList.toggle("open", open);
    openState[sec.id] = open;
  });

  homeEl.querySelectorAll(".sec-head").forEach(h => {
    h.addEventListener("click", e => {
      if (e.target.matches("input[type=checkbox]")) return;
      const sec = $(h.dataset.toggle);
      const open = !sec.classList.contains("open");
      sec.classList.toggle("open", open);
      openState[h.dataset.toggle] = open;
      save();
    });
  });

  homeEl.querySelectorAll("[data-open]").forEach(b =>
    b.addEventListener("click", () => { location.hash = "#/" + b.dataset.open; })
  );

  homeEl.querySelectorAll("input[type=checkbox]").forEach(cb =>
    cb.addEventListener("change", () => {
      const { role, id } = cb.dataset, on = cb.checked;
      if (role === "item") setItem(id, on);
      else if (role === "sub") findSub(id).items.forEach(it => setItem(it.id, on));
      else findSec(id).subs.forEach(sub => sub.items.forEach(it => setItem(it.id, on)));
      save(); refreshHome();
    })
  );

  refreshHome();
}

function setItem(id, on){ if (on) state[id] = true; else delete state[id]; }
function findSec(id){ return DATA.find(s => s.id === id); }
function findSub(id){ for (const s of DATA){ const f = s.subs.find(x => x.id === id); if (f) return f; } }
function findItem(id){ const f = FLAT.find(x => x.item.id === id); return f || null; }

function setBar(barEl, done, total){
  const pct = total ? Math.round(done / total * 100) : 0;
  const complete = total > 0 && done === total;
  barEl.querySelector("i").style.width = pct + "%";
  barEl.classList.toggle("done", complete);
  return { pct, complete };
}

function refreshHome(){
  let allDone = 0, allTotal = 0;

  DATA.forEach(sec => {
    let secDone = 0, secTotal = 0;

    sec.subs.forEach(sub => {
      const done = sub.items.filter(it => state[it.id]).length, total = sub.items.length;
      secDone += done; secTotal += total;

      sub.items.forEach(it => {
        const on = !!state[it.id];
        homeEl.querySelector(`input[data-id="${it.id}"]`).checked = on;
        homeEl.querySelector(`[data-item="${it.id}"]`).classList.toggle("checked", on);
        homeEl.querySelector(`[data-badge="${it.id}"]`).hidden = !hasNote(it.id);
      });

      const subBox = homeEl.querySelector(`input[data-id="${sub.id}"]`);
      subBox.checked = done === total;
      subBox.indeterminate = done > 0 && done < total;
      homeEl.querySelector(`[data-sub="${sub.id}"]`).classList.toggle("complete", done === total);
    });

    allDone += secDone; allTotal += secTotal;

    const secBox = homeEl.querySelector(`input[data-id="${sec.id}"]`);
    secBox.checked = secDone === secTotal;
    secBox.indeterminate = secDone > 0 && secDone < secTotal;

    const r = setBar(homeEl.querySelector(`[data-bar="${sec.id}"]`), secDone, secTotal);
    homeEl.querySelector(`[data-count="${sec.id}"]`).textContent =
      `${secDone}/${secTotal}` + (r.complete ? " ✓ ครบแล้ว" : "");
    $(sec.id).classList.toggle("complete", r.complete);
  });

  const r = setBar($("totalBar"), allDone, allTotal);
  const p = $("totalPct");
  p.textContent = r.pct + "% (" + allDone + "/" + allTotal + ")";
  p.classList.toggle("done", r.complete);
}

  const on = !!state[item.id];

        <textarea id="noteBox" placeholder="เช่น อธิบายด้วยภาษาตัวเอง / คำตอบที่จะใช้ตอบสัมภาษณ์ / จุดที่ยังไม่เข้าใจ..." spellcheck="false">${esc(notes[item.id] || "")}</textarea>
        <div class="noterow">
          <button class="btn" id="btnCopyNote">📋 คัดลอกสรุปหัวข้อนี้</button>
          <button class="btn danger" id="btnClearNote">ล้างสรุปหัวข้อนี้</button>
          <span class="saveflag" id="saveFlag"></span>
        </div>
      </div>

      <div class="pager">
        <button class="btn" id="btnPrev" ${prev ? "" : "disabled"}>← ${prev ? esc(prev.item.t) : "หัวข้อแรก"}</button>
        <button class="btn" id="btnNext" ${next ? "" : "disabled"}>${next ? esc(next.item.t) : "หัวข้อสุดท้าย"} →</button>
      </div>
      <div class="pager" style="margin-top:8px">
        <button class="btn primary" id="btnHome2">← กลับหน้าหลัก</button>
      </div>
    </article>
  `;

  $("dHeadTitle").textContent = item.t;

  $("dCheck").addEventListener("change", e => {
    setItem(item.id, e.target.checked); save();

    box.classList.toggle("on", e.target.checked);
    box.querySelector("label").textContent =
      e.target.checked ? "ทบทวนหัวข้อนี้แล้ว ✓" : "ทำเครื่องหมายว่าทบทวนแล้ว";
  });
  // --- โน้ตสรุป ---
  const box = $("noteBox"), flag = $("saveFlag");
  let timer = null;
  const autosize = () => { box.style.height = "auto"; box.style.height = Math.max(160, box.scrollHeight + 4) + "px"; };
  autosize();
  box.addEventListener("input", () => {
    autosize();
    flag.textContent = "กำลังพิมพ์…"; flag.classList.remove("on");
    clearTimeout(timer);
    timer = setTimeout(() => {
      const v = box.value.trim();
      if (v) notes[item.id] = box.value; else delete notes[item.id];
      save();
      flag.textContent = "บันทึกแล้ว ✓"; flag.classList.add("on");
    }, 500);
  });
  $("btnCopyNote").addEventListener("click", () => {
    const text = "## " + item.t + "\n\n" + (box.value.trim() || "(ยังไม่ได้เขียนสรุป)");
    copyText(text, $("btnCopyNote"));
  });
  $("btnClearNote").addEventListener("click", () => {
    if (!box.value.trim() || !confirm("ล้างสรุปของหัวข้อนี้ใช่ไหม?")) return;
    box.value = ""; delete notes[item.id]; save(); autosize();
    flag.textContent = "ล้างแล้ว"; flag.classList.remove("on");
  });

  if (prev) $("btnPrev").addEventListener("click", () => { location.hash = "#/" + prev.item.id; });
  if (next) $("btnNext").addEventListener("click", () => { location.hash = "#/" + next.item.id; });
  $("btnHome2").addEventListener("click", goHome);

  window.scrollTo(0, 0);
}

/* =========================================================
   ROUTER
   ========================================================= */
let homeScroll = 0;

function goHome(){ location.hash = ""; }

function route(){
  const id = (location.hash || "").replace(/^#\/?/, "").trim();
  const detailMode = !!id && !!findItem(id);

  homeEl.hidden = detailMode;
  detailEl.hidden = !detailMode;
  $("homeHead").hidden = detailMode;
  $("detailHead").hidden = !detailMode;
  $("fabHome").hidden = !detailMode;

  if (detailMode) {
    renderDetail(id);
  } else {
    refreshHome();
    detailEl.innerHTML = "";
    window.scrollTo(0, homeScroll);
  }
}

window.addEventListener("hashchange", () => {
  // จำตำแหน่งเลื่อนของหน้าหลักไว้ เฉพาะตอนที่กำลังออกจากหน้าหลักเท่านั้น
  if (location.hash && !homeEl.hidden) homeScroll = window.scrollY;
  route();
});

$("btnHome").addEventListener("click", goHome);
$("fabHome").addEventListener("click", goHome);

$("btnReset").addEventListener("click", () => {

});

function setAllOpen(open){

  save();
}

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    localStorage.setItem(OPENKEY, JSON.stringify(openState));
    localStorage.setItem(NOTEKEY, JSON.stringify(notes));
  } catch(e){}
}

/* =========================================================
   โน้ตสรุป : helper / คัดลอก / ส่งออกเป็น .md
   ========================================================= */
function hasNote(id){ return !!(notes[id] && notes[id].trim()); }

function copyText(text, btn){
  const done = ok => {
    const old = btn.textContent;
    btn.textContent = ok ? "✓ คัดลอกแล้ว" : "คัดลอกไม่สำเร็จ";
    setTimeout(() => { btn.textContent = old; }, 1600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta); done(ok);
  }
}

function buildMarkdown(){
  const total = FLAT.length;
  const doneCount = FLAT.filter(f => state[f.item.id]).length;
  const noteCount = FLAT.filter(f => hasNote(f.item.id)).length;
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" +
                String(d.getDate()).padStart(2,"0") + " " +
                String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");

  let md = "# สรุปทบทวนก่อนสัมภาษณ์ IT Support / Network\n\n";
  md += "> ไฟล์นี้คือสรุปที่ผู้เรียนเขียนเอง ต้องการให้ตรวจสอบว่าความเข้าใจถูกต้องหรือไม่\n\n";
  md += "- ส่งออกเมื่อ: " + stamp + "\n";
  md += "- ทบทวนแล้ว: " + doneCount + "/" + total + " หัวข้อ\n";
  md += "- เขียนสรุปแล้ว: " + noteCount + "/" + total + " หัวข้อ\n\n---\n";

  DATA.forEach(sec => {
    const secHasNote = sec.subs.some(sub => sub.items.some(it => hasNote(it.id)));
    if (!secHasNote) return;
    md += "\n## " + sec.title + "\n";
    sec.subs.forEach(sub => {
      if (!sub.items.some(it => hasNote(it.id))) return;
      md += "\n### " + sub.title + "\n";
      sub.items.forEach(it => {
        if (!hasNote(it.id)) return;
        md += "\n#### " + it.t + " " + (state[it.id] ? "[ทบทวนแล้ว]" : "[ยังไม่ติ๊ก]") + "\n\n";
        md += notes[it.id].trim() + "\n";
      });
    });
  });

  const skipped = FLAT.filter(f => !hasNote(f.item.id)).map(f => f.item.t);
  if (skipped.length) {
    md += "\n---\n\n## หัวข้อที่ยังไม่ได้เขียนสรุป\n\n";
    skipped.forEach(t => { md += "- " + t + "\n"; });
  }
  return md;
}

function exportMarkdown(){
  const noteCount = FLAT.filter(f => hasNote(f.item.id)).length;
  if (!noteCount) {
    alert("ยังไม่มีสรุปที่เขียนไว้เลย\nลองเข้าไปพิมพ์สรุปในหน้าหัวข้อก่อนนะ");
    return;
  }
  const d = new Date();
  const name = "sarup-it-support-" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") +
               String(d.getDate()).padStart(2,"0") + ".md";
  const blob = new Blob(["﻿" + buildMarkdown()], { type:"text/markdown;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$("btnExport").addEventListener("click", exportMarkdown);

applyTheme();
renderHome();
route();
</script>
